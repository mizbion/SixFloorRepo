<style>
  :root{
    --main:#1d4ed8; --main-dark:#1e3a8a; --accent:#e8b93a;
    --bg:#f4f7fb; --card:#ffffff; --line:#e1e7f0; --text:#1a2333;
    --ok:#2c8c5c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header h1{font-size:16px;margin:0;}
  header .sub{font-size:11px;opacity:.85;margin-top:2px;}
  .wrap{max-width:900px;margin:0 auto;padding:16px;}
  .notice{background:#fff7e6;border:1px solid #f0d9a8;color:#b45309;border-radius:8px;
    padding:12px 16px;font-size:13px;margin-bottom:14px;}
  .sheet{position:sticky;top:46px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:5px 6px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05);}

  .sheet-grid a{flex:0 0 auto;display:block;text-align:center;font-size:10px;line-height:1;padding:4px 6px;
    border-radius:4px;background:#eef2f7;color:#456;text-decoration:none;border:1px solid #dde5ee;}
  .sheet-grid a.opened{background:var(--main);color:#fff;border-color:var(--main);}
  .sheet-grid a.pending{background:#fff3d6;border-color:#f0d9a8;color:#b45309;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;
    scroll-margin-top:120px;}
  .qnum{display:inline-block;background:var(--main);color:#fff;font-size:12px;font-weight:bold;
    border-radius:6px;padding:3px 9px;margin-bottom:8px;}
  .qnum.pending{background:#c98a1a;}
  .qtext{font-size:15px;line-height:1.6;margin-bottom:12px;}
  .qbox{background:#f3f6fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px;}
  table.dtab{border-collapse:collapse;margin:8px 0;font-size:13px;}
  table.dtab th,table.dtab td{border:1px solid var(--line);padding:4px 10px;text-align:center;}
  table.dtab th{background:#eef2f7;}

  .prac .prac-title{font-weight:bold;color:#1a7a4c;margin-bottom:6px;}
  .prac pre{background:#0f2d1f;color:#d8f3e3;padding:8px 10px;border-radius:6px;overflow-x:auto;font-size:12.5px;margin:6px 0;}
  .prac table.dtab{background:#fff;}
  pre{background:#132039;color:#dce9ff;padding:12px 14px;border-radius:8px;overflow-x:auto;
    font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre;margin:8px 0;}
  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid #dfe6ee;border-radius:8px;
    font-size:14px;line-height:1.5;}
  .opt .mk{font-weight:bold;color:var(--main);flex-shrink:0;}
  .opt.correct{background:#e1f5e9;border-color:var(--ok);font-weight:bold;}
  .opt.correct .mk{color:var(--ok);}
  .toggle-btn{background:#eef2f7;color:var(--main-dark);border:1px solid #d5deea;padding:8px 16px;
    border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;}
  .toggle-btn:hover{background:#e2eaf5;}
  .toggle-btn.open{background:var(--main);color:#fff;border-color:var(--main);}
  .toggle-btn.pending{background:#fff3d6;color:#b45309;border-color:#f0d9a8;cursor:default;}
  .expl-box{margin-top:12px;border-top:1px dashed #ccc;padding-top:10px;font-size:13.5px;line-height:1.7;
    color:#456;display:none;}
  .expl-box.show{display:block;}
  .expl-box .ans-line{font-weight:bold;color:var(--ok);margin-bottom:6px;}
  .expl-box .ans-line.pending{color:#b45309;}
  .top-actions{text-align:right;margin-bottom:10px;}
  .top-actions button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;
    font-size:13px;cursor:pointer;color:var(--main-dark);font-weight:bold;}
  .top-actions button:hover{background:#eef2f7;}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sql-practice-btn{position:relative;overflow:hidden;display:inline-block;padding:9px 18px;
    border-radius:999px;background:linear-gradient(90deg,#1a7a4c,#22a566);color:#fff;
    font-weight:bold;font-size:13.5px;text-decoration:none;box-shadow:0 2px 8px rgba(26,122,76,0.35);
    white-space:nowrap;}
  .sql-practice-btn::after{content:"";position:absolute;top:0;left:-75%;width:50%;height:100%;
    background:linear-gradient(120deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.75) 50%,rgba(255,255,255,0) 100%);
    transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite;}
  @keyframes shine{0%{left:-75%;}55%{left:130%;}100%{left:130%;}}
</style>

<script>
const QUESTIONS = [
  {
    "n": 1,
    "q": "데이터 제어어(DCL)에 해당하는 명령어는?",
    "opts": [
      "INSERT",
      "RENAME",
      "COMMIT",
      "REVOKE"
    ],
    "ans": 3,
    "expl": "<b>개념부터 보면:</b> 학교에서 도서관 출입증을 발급하거나 회수하는 일을 떠올려보세요. \"이 사람은 도서관 출입 가능\", \"이 사람은 출입 금지\"처럼 <b>권한을 주고 빼앗는 일</b>이 바로 DCL(Data Control Language, 데이터 제어어)입니다. 대표 명령어가 GRANT(권한 부여), REVOKE(권한 회수)입니다.<br>\n<b>문제 적용:</b> 보기 중 REVOKE만 권한을 회수하는 명령어이므로 정답은 ④번입니다.<br>\n<b>오답 정리:</b> INSERT는 데이터를 새로 넣는 DML, RENAME은 이름을 바꾸는 DDL, COMMIT은 트랜잭션을 확정하는 TCL입니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>권한을 회수/부여하는 DCL을 EMP 테이블에 직접 적용해보면:</div><pre>GRANT SELECT ON EMP TO STUDENT_ROLE;  -- 권한 부여\nREVOKE SELECT ON EMP FROM STUDENT_ROLE; -- 권한 회수</pre><div>GRANT는 열쇠를 주는 것, REVOKE는 열쇠를 뺏는 것이라고 기억하면 쉽습니다.</div></div>"
  },
  {
    "n": 2,
    "q": "아래에서 빈칸 ㉠에 들어갈 내용으로 가장 적절한 것은?<div class='qbox'><b>[아래]</b><br>INSERT는 테이블에 데이터를 입력할 때 사용한다.<br>㉠ 는 입력한 정보 중에 잘못 입력되거나 변경이 발생하여 정보를 수정할 때 사용한다.<br>DELETE는 테이블의 정보가 필요 없게 되었을 경우 데이터 삭제를 수행한다.</div>",
    "opts": [
      "UPDATE",
      "SELECT",
      "ALTER",
      "REVOKE"
    ],
    "ans": 0,
    "expl": "<b>개념부터 보면:</b> 반 이름표를 새로 붙이는 것이 INSERT, 잘못 붙인 이름표를 <b>다시 고쳐 쓰는 것</b>이 바로 UPDATE입니다.<br>\n<b>문제 적용:</b> 지문에서 \"잘못 입력되거나 변경이 발생하여 정보를 수정할 때 사용한다\"고 했으므로 빈칸은 UPDATE입니다. 정답 ①번.<br>\n<b>오답 정리:</b> SELECT는 조회, ALTER는 테이블 구조 변경(DDL), REVOKE는 권한 회수(DCL)입니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>STUDENTS 테이블에서 잘못 입력된 학년을 수정(UPDATE)해보면:</div><pre>UPDATE STUDENTS\nSET YEAR = 3\nWHERE STU_ID = 'S001';</pre></div>"
  },
  {
    "n": 3,
    "q": "아래 내용에 해당하는 SQL 명령어의 종류는?<div class='qbox'><b>[아래]</b><br>논리적인 작업의 단위를 묶어 DML에 의해 조작된 결과를 작업단위(Transaction)별로 제어하는 명령어인 Commit, Rollback, Savepoint 등이 여기에 해당하며, 일부에서는 DCL(Data Control Language)로 분류하기도 한다.</div>",
    "opts": [
      "DDL",
      "DML",
      "TCL",
      "TML"
    ],
    "ans": 2,
    "expl": "<b>개념부터 보면:</b> 게임에서 저장 지점(세이브포인트)을 만들고, 그 지점까지 되돌리거나(ROLLBACK) 저장을 확정(COMMIT)하는 것처럼, <b>거래(트랜잭션) 단위로 결과를 확정하거나 취소하는 명령어</b>가 TCL(Transaction Control Language)입니다.<br>\n<b>문제 적용:</b> Commit, Rollback, Savepoint가 언급되었으므로 TCL입니다. 정답 ③번.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>EMP 테이블에 사원을 등록하고 SAVEPOINT/ROLLBACK으로 TCL을 체험해보면:</div><pre>INSERT INTO EMP (EMPNO, ENAME, DEPTNO) VALUES (9001, '테스트사원', 10);\nSAVEPOINT sp1;\nUPDATE EMP SET SAL = 9999 WHERE EMPNO = 9001;\nROLLBACK TO sp1;  -- SAL 변경만 취소됨, INSERT는 유지\nCOMMIT;</pre></div>"
  },
  {
    "n": 4,
    "q": "SELECT 문에 대한 설명으로 가장 적절하지 않은 것은?",
    "opts": [
      "WHERE 절은 필수가 아니므로 생략 가능하다.",
      "DISTINCT 옵션을 통해 중복된 데이터가 있을 경우 1건으로 처리해 출력할 수 있다.",
      "FROM 절이 없는 다음 문장 \"SELECT COL1, COL2\"는 에러 없이 수행된다.",
      "SELECT List에 서브쿼리가 사용될 수 있다."
    ],
    "ans": 2,
    "expl": "<b>개념부터 보면:</b> \"누구의 어떤 자료를 보여줘\"라고 물을 때 반드시 \"누구\"(FROM 절 = 테이블)와 \"무엇을 보여줘\"(SELECT 절)가 있어야 합니다. FROM이 없으면 어디서 데이터를 가져와야 할지 알 수 없으니 에러가 납니다.<br>\n<b>문제 적용:</b> \"SELECT COL1, COL2\"처럼 FROM 절이 없는 문장은 에러 없이 수행된다는 ③번 설명이 틀렸습니다. 정답 ③번.<br>\n<b>오답 정리:</b> WHERE는 생략 가능, DISTINCT는 중복 제거, 서브쿼리는 SELECT List에 올 수 있다는 설명은 모두 맞습니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>FROM 절 없이 SELECT만 실행되는지 우리 DB에서 확인해보면:</div><pre>SELECT 1+1;             -- 대부분 DBMS에서 FROM 없이 즉시 실행\nSELECT ENAME, SAL FROM EMP; -- FROM이 있는 정상적인 조회</pre><div>MySQL/SQL Server는 FROM 없이 바로 실행되지만, Oracle은 FROM DUAL을 붙여야 합니다.</div></div>"
  },
  {
    "n": 5,
    "q": "SQL의 종류와 해당되는 명령어를 바르게 연결한 것은?",
    "opts": [
      "DML - SELECT",
      "TCL - GRANT",
      "DCL - DROP",
      "DML - ALTER"
    ],
    "ans": 0,
    "expl": "<b>개념부터 보면:</b> 명령어를 4가지 서랍에 정리한다고 생각해보세요.<br>\n<table class=\"dtab\"><tr><th>서랍(종류)</th><th>담긴 명령어</th></tr>\n<tr><td>DDL(정의)</td><td>CREATE, ALTER, DROP, RENAME</td></tr>\n<tr><td>DML(조작)</td><td>SELECT, INSERT, UPDATE, DELETE</td></tr>\n<tr><td>DCL(제어)</td><td>GRANT, REVOKE</td></tr>\n<tr><td>TCL(트랜잭션)</td><td>COMMIT, ROLLBACK</td></tr></table>\n<b>문제 적용:</b> DML-SELECT만 서랍이 맞게 짝지어졌습니다. 정답 ①번.<br>\n<b>오답 정리:</b> TCL-GRANT(GRANT는 DCL), DCL-DROP(DROP은 DDL), DML-ALTER(ALTER는 DDL)로 모두 서랍이 틀렸습니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>네 가지 SQL 종류를 EMP/DEPT 테이블로 한 줄씩 실습해보면:</div><pre>-- DDL\nCREATE TABLE TEMP_EMP (EMPNO INT, ENAME TEXT);\n-- DML\nSELECT * FROM EMP WHERE DEPTNO = 10;\n-- DCL\nGRANT SELECT ON EMP TO PUBLIC;\n-- TCL\nCOMMIT;</pre></div>"
  },
  {
    "n": 6,
    "q": "아래 내용의 범주에 해당하는 SQL 명령어로 가장 적절하지 <u>않은</u> 것은?<div class='qbox'><b>[아래]</b><br>테이블의 구조를 생성, 변경, 삭제하는 등 데이터 구조를 정의하는 데 사용되는 명령어이다.</div>",
    "opts": [
      "CREATE",
      "GRANT",
      "ALTER",
      "DROP"
    ],
    "ans": 1,
    "expl": "<b>개념부터 보면:</b> 교실 책상 배치도를 새로 만들고(CREATE), 배치를 바꾸고(ALTER), 배치도를 아예 없애는(DROP) 것처럼, <b>테이블(자료 구조) 자체를 만들고 바꾸고 없애는 명령어</b>가 DDL입니다.<br>\n<b>문제 적용:</b> GRANT는 권한을 주는 DCL 명령어이므로 \"데이터 구조 정의\"라는 범주에 속하지 않습니다. 정답 ②번.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>DEPT 테이블 구조를 정의(DDL)하는 명령어와 권한(DCL)을 주는 명령어를 비교해보면:</div><pre>ALTER TABLE DEPT ADD (MANAGER_ID INT);  -- DDL: 구조 변경\nGRANT SELECT ON DEPT TO PUBLIC;         -- DCL: 권한 부여 (구조와 무관)</pre></div>"
  },
  {
    "n": 7,
    "q": "데이터베이스에서 조회되는 데이터에 대한 조건을 설정하여 원하는 데이터만을 검색하기 위해 사용하는 절로 가장 적절한 것은?",
    "opts": [
      "WHERE 절",
      "GROUP BY 절",
      "ORDER BY 절",
      "HAVING 절"
    ],
    "ans": 0,
    "expl": "<b>개념부터 보면:</b> 학생 명단에서 \"3학년만\" 뽑고 싶을 때 조건을 거는 것처럼, <b>원하는 조건에 맞는 행만 걸러내는 절</b>이 WHERE 절입니다.<br>\n<b>문제 적용:</b> \"조건을 설정하여 원하는 데이터만을 검색\"한다는 설명에 정확히 맞는 것은 WHERE 절입니다. 정답 ①번.<br>\n<b>오답 정리:</b> GROUP BY는 그룹으로 묶기, ORDER BY는 정렬, HAVING은 그룹 결과에 대한 조건입니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>STUDENTS 테이블에서 3학년만 조건을 걸어 조회해보면:</div><pre>SELECT STU_ID, NAME, YEAR\nFROM STUDENTS\nWHERE YEAR = 3;</pre></div>"
  },
  {
    "n": 8,
    "q": "SQL 문을 실행했을 때 오류가 발생하는 부분으로 가장 적절한 것은?<pre>SELECT DEPTNO, ROUND(AVG(SAL),2)\nFROM EMP\nWHERE AVG(SAL) &gt;= 1800\nGROUP BY DEPTNO;</pre>",
    "opts": [
      "SELECT DEPTNO, ROUND(AVG(SAL),2)",
      "FROM EMP",
      "WHERE AVG(SAL) >= 1800",
      "GROUP BY DEPTNO;"
    ],
    "ans": 2,
    "expl": "<b>개념부터 보면:</b> WHERE 절은 \"아직 그룹으로 묶이기 전\"의 개별 데이터를 거르는 단계라서, 그룹을 묶은 뒤에야 계산되는 AVG 같은 집계 함수를 쓸 수 없습니다. (반 전체 평균을 알기도 전에 \"평균보다 큰 학생만\"이라고 조건을 걸 수는 없는 것과 같은 이치입니다.)<br>\n<b>문제 적용:</b> WHERE AVG(SAL) &gt;= 1800 부분이 바로 이 규칙을 어겼습니다. 정답 ③번.<br>\n<b>오답 정리:</b> 집계 함수는 HAVING 절에서 사용해야 합니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>같은 조건을 WHERE 대신 HAVING으로 바꾸면 정상 실행됩니다:</div><pre>-- 오류 발생 (WHERE에 집계함수)\nSELECT DEPTNO, ROUND(AVG(SAL),2)\nFROM EMP\nWHERE AVG(SAL) >= 1800\nGROUP BY DEPTNO;\n\n-- 올바른 버전 (HAVING으로 수정)\nSELECT DEPTNO, ROUND(AVG(SAL),2)\nFROM EMP\nGROUP BY DEPTNO\nHAVING AVG(SAL) >= 1800;</pre></div>"
  },

    "q": "아래를 참고할 때 평가대상상품에 대한 품질평가항목별 최종 평가결과를 출력하는 SQL로 가장 적절한 것은? (단, 평가항목에 대한 평가등급이 기대수준에 미치지 못할 경우 해당 평가항목에 대해서만 재평가를 수행한다.)<div class='qbox'><b>[아래]</b><br>품질평가항목(평가항목ID, 평가항목명) — 평가결과(상품ID(FK), 평가회차, 평가항목ID(FK), 평가등급, 평가일자) — 평가대상상품(상품ID, 상품명)</div><pre>① SELECT B.상품ID, B.상품명, C.평가항목ID, C.평가항목명, A.평가회차, A.평가등급, A.평가일자\n   FROM   평가결과 A, 평가대상상품 B, 품질평가항목 C,\n          (SELECT MAX(평가회차) AS 평가회차 FROM 평가결과) D\n   WHERE  A.상품ID = B.상품ID\n   AND    A.평가항목ID = C.평가항목ID\n   AND    A.평가회차 = D.평가회차;\n\n② SELECT B.상품ID, B.상품명, C.평가항목ID, C.평가항목명, A.평가회차, A.평가등급, A.평가일자\n   FROM   평가결과 A, 평가대상상품 B, 품질평가항목 C\n   WHERE  A.상품ID = B.상품ID\n   AND    A.평가항목ID = C.평가항목ID\n   AND    A.평가회차 = (SELECT MAX(X.평가회차)\n                     FROM   평가결과 X\n                     WHERE  X.상품ID = B.상품ID\n                     AND    X.평가항목ID = C.평가항목ID);\n\n③ SELECT B.상품ID, B.상품명, C.평가항목ID, C.평가항목명\n     ,MAX(A.평가회차) AS 평가회차\n     ,MAX(A.평가등급) AS 평가등급\n     ,MAX(A.평가일자) AS 평가일자\n   FROM   평가결과 A, 평가대상상품 B, 품질평가항목 C\n   WHERE  A.상품ID = B.상품ID\n   AND    A.평가항목ID = C.평가항목ID\n   GROUP BY B.상품ID, B.상품명, C.평가항목ID, C.평가항목명;\n\n④ SELECT B.상품ID, B.상품명, C.평가항목ID, C.평가항목명, A.평가회차, A.평가등급, A.평가일자\n   FROM   (SELECT 상품ID, 평가항목ID\n             ,MAX(평가회차) AS 평가회차\n             ,MAX(평가등급) AS 평가등급\n             ,MAX(평가일자) AS 평가일자\n           FROM   평가결과\n           GROUP BY 상품ID, 평가항목ID) A, 평가대상상품 B, 품질평가항목 C\n   WHERE  A.상품ID = B.상품ID\n   AND    A.평가항목ID = C.평가항목ID;</pre>",

    "q": "아래에서 뷰 생성 스크립트를 실행한 후, SQL을 실행한 결과로 가장 적절한 것은?<div class='qbox'><b>[아래]</b><table class='dtab'><tr><th>C1</th><th>C2</th></tr><tr><td>A</td><td>100</td></tr><tr><td>B</td><td>200</td></tr><tr><td>B</td><td>100</td></tr><tr><td>B</td><td>&lt;NULL&gt;</td></tr><tr><td>&lt;NULL&gt;</td><td>200</td></tr></table><pre>[뷰 생성 스크립트]\nCREATE VIEW V_TBL\nAS\nSELECT *\nFROM TBL\nWHERE C1 = 'B' OR C1 IS NULL\n\n[SQL]\nSELECT SUM(C2) C2\nFROM V_TBL\nWHERE C2 &gt;= 200 AND C1 = 'B'</pre></div>",

  {
    "n": 77,
    "q": "아래 SQL의 실행 결과로 가장 적절한 것은?<div class='qbox'><b>[아래]</b><table class='dtab'><tr><th>사원ID</th><th>부서ID</th><th>연봉</th></tr><tr><td>001</td><td>100</td><td>2500</td></tr><tr><td>002</td><td>100</td><td>3000</td></tr><tr><td>003</td><td>200</td><td>4500</td></tr><tr><td>004</td><td>200</td><td>3000</td></tr><tr><td>005</td><td>200</td><td>2500</td></tr><tr><td>006</td><td>300</td><td>4500</td></tr><tr><td>007</td><td>300</td><td>3000</td></tr></table><pre>SELECT 사원ID, COL2, COL3\nFROM (SELECT 사원ID\n       ,ROW_NUMBER() OVER(PARTITION BY 부서ID\n         ORDER BY 연봉 DESC) AS COL1\n       ,SUM(연봉) OVER(PARTITION BY 부서ID ORDER\n         BY 사원ID ROWS BETWEEN UNBOUNDED PRECEDING AND\n         CURRENT ROW) AS COL2\n       ,MAX(연봉) OVER(ORDER BY 연봉 DESC ROWS\n         CURRENT ROW) AS COL3\n      FROM 사원)\nWHERE COL1 = 2\nORDER BY 1;</pre></div>",

    "ans": 1,
    "expl": "<b>개념부터 보면:</b> COL1은 부서ID별 연봉 내림차순 순위(ROW_NUMBER), COL2는 부서ID별 첫 행부터 현재 행까지의 누적합, COL3은 전체 데이터에서 \"현재 행까지\"의 최댓값(사실상 현재 행 자체의 값, ROWS CURRENT ROW는 자기 자신만 보는 범위)입니다.<br>\n<b>문제 적용:</b> COL1=2인 사원(001,004,007)의 COL2(부서별 누적합)와 COL3(그 시점까지의 최댓값)을 정확히 계산하면 ②번 결과가 나옵니다. 정답 ②번.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>EMP 테이블 그대로 부서별 순위(ROW_NUMBER)와 누적합(SUM OVER)을 함께 실습해보면:</div><pre>SELECT EMPNO,\n       ROW_NUMBER() OVER(PARTITION BY DEPTNO ORDER BY SAL DESC) AS 순위,\n       SUM(SAL) OVER(PARTITION BY DEPTNO ORDER BY EMPNO\n         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS 누적급여\nFROM EMP;</pre></div>"

  {
    "n": 78,
    "q": "아래 실행 결과를 출력하는 SQL로 가장 적절한 것은?<div class='qbox'><b>[아래]</b><br>지역(지역ID, 지역명) — 이용내역(이용자ID, 이용일시, 이용량, 지역ID(FK))<br><br>[실행 결과] 지역명/이용월/이용량: 서울/2014.01/1000, 서울/2014.02/1000, 서울/월별합계/2000, 경기/2014.01/1000, 경기/2014.03/2000, 경기/월별합계/3000, 대전/2014.05/1500, 대전/2014.06/1000, 대전/월별합계/2500, 지역전체/월별합계/7500</div><pre>① SELECT (CASE GROUPING(B.지역명) WHEN 0 THEN '지역전체'\n           ELSE B.지역명 END) AS 지역명\n     ,(CASE GROUPING(TO_CHAR(A.이용일시, 'YYYY.MM'))\n           WHEN 0 THEN '월별합계'\n           ELSE TO_CHAR(A.이용일시, 'YYYY.MM')\n       END) AS 이용월\n     ,SUM(A.이용량) AS 이용량\n   FROM 이용내역 A INNER JOIN 지역 B ON (A.지역ID = B.지역ID)\n   GROUP BY ROLLUP(B.지역명, TO_CHAR(A.이용일시, 'YYYY.MM'))\n\n② SELECT (CASE GROUPING(B.지역ID) WHEN 1 THEN '지역전체'\n           ELSE MIN(B.지역명) END) AS 지역명\n     ,(CASE GROUPING(TO_CHAR(A.이용일시, 'YYYY.MM'))\n           WHEN 1 THEN '월별합계'\n           ELSE TO_CHAR(A.이용일시, 'YYYY.MM')\n       END) AS 이용월\n     ,SUM(A.이용량) AS 이용량\n   FROM 이용내역 A INNER JOIN 지역 B ON (A.지역ID = B.지역ID)\n   GROUP BY ROLLUP(B.지역ID, TO_CHAR(A.이용일시, 'YYYY.MM'))\n\n③ SELECT (CASE GROUPING(B.지역명) WHEN 1 THEN '지역전체'\n           ELSE B.지역명 END) AS 지역명\n     ,(CASE GROUPING(TO_CHAR(A.이용일시, 'YYYY.MM'))\n           WHEN 1 THEN '월별합계'\n           ELSE TO_CHAR(A.이용일시, 'YYYY.MM')\n       END) AS 이용월\n     ,SUM(A.이용량) AS 이용량\n   FROM 이용내역 A INNER JOIN 지역 B ON (A.지역ID = B.지역ID)\n   GROUP BY CUBE(B.지역명, TO_CHAR(A.이용일시, 'YYYY.MM'))\n\n④ SELECT (CASE GROUPING(B.지역ID) WHEN 1 THEN '지역전체'\n           ELSE MIN(B.지역명) END) AS 지역명\n     ,(CASE GROUPING(TO_CHAR(A.이용일시, 'YYYY.MM'))\n           WHEN 1 THEN '월별합계'\n           ELSE TO_CHAR(A.이용일시, 'YYYY.MM')\n       END) AS 이용월\n     ,SUM(A.이용량) AS 이용량\n   FROM 이용내역 A INNER JOIN 지역 B ON (A.지역ID = B.지역ID)\n   GROUP BY GROUPING SETS(B.지역ID, TO_CHAR(A.이용일시, 'YYYY.MM'))</pre></div>",
    "opts": [
      "①",
      "②",
      "③",
      "④"

    "ans": 1,
    "expl": "<b>개념부터 보면:</b> 지역별로 \"월별 소계 + 지역 소계 + 전체합계\"까지 3단계 계층 집계를 만들려면 ROLLUP(지역, 월)을 씁니다. GROUPING 함수는 \"이 값이 소계로 만들어진 합계행인지\"를 판별하는데, ROLLUP에서는 소계 여부를 <b>1(합계행)</b>로 표시합니다(0이 아님에 주의).<br>\n<b>문제 적용:</b> GROUPING() 함수 값을 1일 때 '지역전체'/'월별합계'로 바꾸고, ROLLUP(B.지역ID, TO_CHAR(...))를 사용한 ②번이 정답입니다. 정답 ②번.<br>\n<b>오답 정리:</b> ①번은 GROUPING 값을 0으로 잘못 비교했고, ③CUBE는 지역·월의 모든 조합별 집계까지 만들어 원하는 계층 구조와 다르며, ④GROUPING SETS는 지역합계와 월합계를 각각 따로 만들 뿐 계층 구조(지역→월)가 아닙니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>ORDERS를 상품(PROD_ID)·주문월별로 묶어 ROLLUP 소계·합계를 만들어보면:</div><pre>SELECT PROD_ID,\n       TO_CHAR(ORDER_DATE, 'YYYY-MM') AS 주문월,\n       SUM(AMOUNT) AS 매출액\nFROM ORDERS\nGROUP BY ROLLUP (PROD_ID, TO_CHAR(ORDER_DATE, 'YYYY-MM'));</pre></div>"

    "expl": "<b>개념부터 보면:</b> \"가장 최근에 변경된 데이터를 반영\"하려면, 부서임시 테이블에서 같은 부서코드끼리 <b>변경일자가 가장 늦은(MAX) 행</b>을 골라 그 담당자로 업데이트해야 합니다.<br>\n<b>문제 적용:</b> WHERE B.부서코드=A.부서코드 AND B.변경일자=(SELECT MAX(C.변경일자) FROM 부서임시 C WHERE C.부서코드=B.부서코드)로 정확히 최신 담당자를 찾아 반영하고, WHERE 절로 부서임시에 있는 부서코드만 UPDATE 대상으로 제한한 ③번이 정답입니다. 정답 ③번.<br>\n<b>오답 정리:</b> ①②번은 UPDATE의 WHERE 절이 없어(또는 조건이 부적절해) 부서임시에 없는 나머지 부서까지 모두 NULL로 바뀌어버리고, ④번은 특정 날짜('2015.01.25')를 하드코딩해서 A007처럼 다른 날짜에 변경된 데이터를 놓칩니다.<div class=\"prac\"><div class=\"prac-title\">🔧 실습해보기 (우리 ERD 기준)</div><div>ENROLL의 최신 SCORE를 반영하는 상황을 COURSES 담당교수 갱신으로 바꿔 실습해보면(가상의 이력 테이블 COURSES_HIST가 있다고 가정):</div><pre>UPDATE COURSES A\nSET PROFESSOR = (SELECT B.PROFESSOR\n                 FROM COURSES_HIST B\n                 WHERE B.SUB_ID = A.SUB_ID\n                 AND   B.변경일자 = (SELECT MAX(C.변경일자)\n                                    FROM COURSES_HIST C\n                                    WHERE C.SUB_ID = B.SUB_ID))\nWHERE SUB_ID IN (SELECT SUB_ID FROM COURSES_HIST);</pre><div>핵심은 '같은 SUB_ID끼리 묶어 가장 최근 변경일자'를 찾는 연관 서브쿼리 패턴입니다.</div></div>"
  }
];
const MARK = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
const openState = {};

function render(){
  const qlist = document.getElementById('qlist');
  const grid = document.getElementById('sheetGrid');
  let html = '';
  let gridHtml = '';

  QUESTIONS.forEach(function(item){
    const qi = item.n;
    const pending = (item.ans === null || item.ans === undefined);
    gridHtml += '<a href="#q' + qi + '" id="sheet-' + qi + '"' + (pending ? ' class="pending"' : '') + '>' + qi + '</a>';

    html += '<div class="qcard" id="q' + qi + '">';
    html += '<span class="qnum' + (pending ? ' pending' : '') + '">문제 ' + qi + '</span>';
    html += '<div class="qtext">' + item.q + '</div>';
    html += '<div class="opts" id="opts-' + qi + '">';
    item.opts.forEach(function(opt, oi){
      html += '<div class="opt" id="opt-' + qi + '-' + oi + '"><span class="mk">' + MARK[oi] +
        '</span><span>' + opt + '</span></div>';
    });
    html += '</div>';
    if(pending){
      html += '<button class="toggle-btn pending" disabled>⏳ 정답 준비 중</button>';
      html += '<div class="expl-box" id="ex-' + qi + '">' +
        '<div class="ans-line pending">정답/해설은 노랭이 교재 확인 후 추가 예정입니다.</div></div>';
    } else {
      html += '<button class="toggle-btn" id="btn-' + qi + '" onclick="toggleOne(' + qi + ')">정답 및 해설 보기</button>';
      html += '<div class="expl-box" id="ex-' + qi + '">' +
        '<div class="ans-line">정답: ' + MARK[item.ans] + '</div>' +
        (item.expl || '') + '</div>';
    }
    html += '</div>';
  });

  qlist.innerHTML = html;
  grid.innerHTML = gridHtml;
}

function setOpen(qi, open){
  const q = QUESTIONS.find(function(x){ return x.n === qi; });
  if(!q || q.ans === null || q.ans === undefined) return;
  openState[qi] = open;
  const ex = document.getElementById('ex-' + qi);
  const btn = document.getElementById('btn-' + qi);
  const sheet = document.getElementById('sheet-' + qi);
  const correctEl = document.getElementById('opt-' + qi + '-' + q.ans);

  if(open){
    ex.classList.add('show');
    btn.classList.add('open');
    btn.textContent = '정답 및 해설 접기';
    if(sheet) sheet.classList.add('opened');
    if(correctEl) correctEl.classList.add('correct');
  } else {
    ex.classList.remove('show');
    btn.classList.remove('open');
    btn.textContent = '정답 및 해설 보기';
    if(sheet) sheet.classList.remove('opened');
    if(correctEl) correctEl.classList.remove('correct');
  }
}

function toggleOne(qi){
  setOpen(qi, !openState[qi]);
}

function toggleAll(open){
  QUESTIONS.forEach(function(item){
    setOpen(item.n, open);
  });
}

render();
</script>
</body>
</html>
