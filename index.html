<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[REPO] AI웹앱서비스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f7fc;
    --white:     #ffffff;
    --border:    #e3e8f4;
    --border2:   #edf0f9;
    --text:      #1b2540;
    --muted:     #7282a4;
    --muted2:    #aab4cc;

    --blue:      #2f7cf6; --blue-bg:   #eef4ff; --blue-bd:   #c2d8fd;
    --teal:      #0f9e82; --teal-bg:   #e8faf5; --teal-bd:   #8de5ce;
    --orange:    #e8720c; --orange-bg: #fff4ea; --orange-bd: #fccfa0;
    --purple:    #7c4dcc; --purple-bg: #f3eeff; --purple-bd: #cdb4f8;
    --rose:      #d63b6e; --rose-bg:   #fff0f5; --rose-bd:   #f8b4cc;
    --cyan:      #0899bc; --cyan-bg:   #e8f8ff; --cyan-bd:   #8ddcf0;
    --green:     #1d9e4e; --green-bg:  #eafaf0; --green-bd:  #8de0b0;
    --amber:     #c47c0a; --amber-bg:  #fffaea; --amber-bd:  #f5d88a;

    --r:  14px;
    --rs: 8px;
    --sh0: 0 1px 3px rgba(27,37,64,.06);
    --sh1: 0 3px 12px rgba(27,37,64,.09);
    --sh2: 0 8px 30px rgba(27,37,64,.13);
  }

  *,*::before,*::after { margin:0;padding:0;box-sizing:border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ── TOPBAR ─────────────────────────────── */
  .topbar {
    background: var(--white);
    border-bottom: 1.5px solid var(--border);
    position: sticky; top:0; z-index:200;
    box-shadow: var(--sh0);
  }
  .topbar-inner {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 28px;
    display: flex;
    align-items: stretch;
    height: 58px;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 22px;
    border-right: 1.5px solid var(--border2);
    flex-shrink: 0;
  }
  .brand-icon {
    width: 34px; height: 34px;
    background: var(--blue-bg);
    border: 1.5px solid var(--blue-bd);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -.3px;
  }
  .brand-name span { color: var(--blue); }

  .search-area {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
    border-right: 1.5px solid var(--border2);
  }
  .search-icon { color: var(--muted2); font-size:16px; flex-shrink:0; }
  .search-area input {
    border:none; outline:none; background:none;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    width: 100%;
  }
  .search-area input::placeholder { color: var(--muted2); }

  .topbar-stats {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-left: 22px;
    flex-shrink: 0;
  }
  .stat-chip { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .stat-val  { font-weight:800; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; }

  /* ── SUBJECT TABS ───────────────────────── */
  .subnav-wrap {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--sh0);
  }
  .subnav {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 28px;
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .subnav::-webkit-scrollbar { display:none; }
  .nav-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all .18s;
    white-space: nowrap;
    user-select: none;
    flex-shrink: 0;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-cnt {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1px 7px;
    color: var(--muted);
    font-weight: 700;
    transition: all .18s;
  }
  .nav-tab.active .tab-cnt {
    background: var(--blue-bg);
    border-color: var(--blue-bd);
    color: var(--blue);
  }

  /* ── MAIN ───────────────────────────────── */
  .main {
    max-width: 1060px;
    margin: 0 auto;
    padding: 28px;
  }

  /* ── SUBJECT SECTION ────────────────────── */
  .subject-section { margin-bottom: 42px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .subject-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 800;
    padding: 6px 16px;
    border-radius: 30px; border: 2px solid;
    white-space: nowrap; flex-shrink: 0;
  }
  .section-line { flex:1; height:1.5px; background:var(--border); }
  .section-cnt  { font-size:12px; font-weight:700; color:var(--muted); font-family:'JetBrains Mono',monospace; flex-shrink:0; }

  /* ── UNIT GROUP ─────────────────────────── */
  .unit-group { margin-bottom: 22px; }
  .unit-label {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; padding-left: 2px;
  }
  .unit-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .unit-name { font-size:13px; font-weight:700; color:var(--text); }
  .unit-line { flex:1; height:1px; background:var(--border2); }
  .unit-cnt  { font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted2); }

  /* ── CARD GRID ──────────────────────────── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  /* ── LESSON CARD ────────────────────────── */
  .lesson-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--r);
    padding: 16px 18px 13px;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--sh0);
    transition: box-shadow .2s, border-color .2s, transform .18s;
    position: relative; overflow: hidden;
  }
  .lesson-card::before {
    content:'';
    position:absolute; top:0; left:0;
    width:3.5px; height:100%;
    background: var(--accent, var(--blue));
    opacity:.7;
    transition: opacity .2s, width .18s;
  }
  .lesson-card:hover {
    box-shadow: var(--sh2);
    border-color: var(--accent, var(--blue));
    transform: translateY(-3px);
  }
  .lesson-card:hover::before { opacity:1; width:4px; }

  .card-meta {
    display: flex; align-items: center; gap: 7px;
  }
  .card-dot {
    width:7px; height:7px; border-radius:50%;
    background: var(--accent, var(--blue)); flex-shrink:0;
  }
  .card-unit-label {
    font-size:10px; font-weight:700; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-new {
    margin-left:auto;
    font-size:10px; font-weight:800;
    background:#fff0f5; color:var(--rose);
    border:1px solid var(--rose-bd);
    padding:1px 7px; border-radius:20px; flex-shrink:0;
  }

  .card-title {
    font-size:14px; font-weight:700;
    color:var(--text); line-height:1.45;
  }
  .card-desc {
    font-size:12px; color:var(--muted);
    line-height:1.65; flex:1;
  }
  .card-footer {
    display:flex; align-items:center; justify-content:space-between;
    padding-top:9px;
    border-top:1px solid var(--border2);
    margin-top:2px;
  }
  .card-date  { font-size:11px; color:var(--muted2); font-family:'JetBrains Mono',monospace; }
  .card-arrow { font-size:14px; color:var(--muted2); transition:transform .2s, color .2s; }
  .lesson-card:hover .card-arrow { transform:translateX(4px); color:var(--accent,var(--blue)); }

  /* ── EMPTY ──────────────────────────────── */
  .empty-state {
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    padding:72px 20px; gap:10px;
    color:var(--muted); font-size:13px;
  }
  .empty-state.show { display:flex; }
  .empty-state .ei  { font-size:44px; }

  /* ── FOOTER ─────────────────────────────── */
  .footer {
    text-align:center; padding:20px 28px 48px;
    font-size:12px; color:var(--muted2); line-height:2.2;
  }
  .footer code {
    font-family:'JetBrains Mono',monospace; font-size:11px;
    background:var(--white); border:1px solid var(--border);
    padding:2px 8px; border-radius:5px; color:var(--blue);
  }

  .backtop {
    position:fixed; bottom:22px; right:22px;
    width:38px; height:38px;
    background:var(--blue); color:#fff;
    border:none; border-radius:50%;
    font-size:16px; cursor:pointer;
    box-shadow:0 4px 16px rgba(47,124,246,.38);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .3s; z-index:300;
  }
  .backtop.show { opacity:1; }

  @media(max-width:640px){
    .topbar-stats { display:none; }
    .topbar-inner, .subnav, .main { padding-left:16px; padding-right:16px; }
    .card-grid { grid-template-columns:1fr; }
  }
</style>
</head>

   설정값 (건드리지 않아도 됩니다)
══════════════════════════════════════════════════════════ */
const PALETTE = [
  {c:'var(--blue)',   bg:'var(--blue-bg)',   bd:'var(--blue-bd)'  },
  {c:'var(--teal)',   bg:'var(--teal-bg)',   bd:'var(--teal-bd)'  },
  {c:'var(--orange)', bg:'var(--orange-bg)', bd:'var(--orange-bd)'},
  {c:'var(--purple)', bg:'var(--purple-bg)', bd:'var(--purple-bd)'},
  {c:'var(--rose)',   bg:'var(--rose-bg)',   bd:'var(--rose-bd)'  },
  {c:'var(--cyan)',   bg:'var(--cyan-bg)',   bd:'var(--cyan-bd)'  },
  {c:'var(--green)',  bg:'var(--green-bg)',  bd:'var(--green-bd)' },
  {c:'var(--amber)',  bg:'var(--amber-bg)',  bd:'var(--amber-bd)' },
];
const ICONS = {
  "AI":"🤖","파이썬":"💻","웹개발":"🌐",
  "데이터베이스":"🗄️","네트워크":"📡","디자인":"🎨",
  "알고리즘":"🧮","모바일":"📱"
};

let activeTab   = 'all';
let searchQuery = '';

/* ── 초기화 ─────────────────────────────── */
function init() {
  const subjects = [...new Set(LESSONS.map(l => l.subject))];
  const palMap   = Object.fromEntries(subjects.map((s,i) => [s, PALETTE[i % PALETTE.length]]));

  document.getElementById('statTotal').textContent   = LESSONS.length;
  document.getElementById('statSubject').textContent = subjects.length;

  buildTabs(subjects, palMap);
  buildSections(subjects, palMap);
  applyFilter();
}

/* ── 탭 ─────────────────────────────────── */
function buildTabs(subjects, palMap) {
  const bar = document.getElementById('subnavBar');
  bar.innerHTML = '';
  appendTab(bar, '📋 전체', 'all', LESSONS.length);
  subjects.forEach(s => {
    const cnt = LESSONS.filter(l => l.subject === s).length;
    appendTab(bar, (ICONS[s]||'📄') + ' ' + s, s, cnt);
  });
}
function appendTab(bar, label, key, cnt) {
  const d = document.createElement('div');
  d.className = 'nav-tab' + (activeTab === key ? ' active' : '');
  d.dataset.key = key;
  d.innerHTML = `${label} <span class="tab-cnt">${cnt}</span>`;
  d.onclick = () => {
    activeTab = key;
    bar.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    d.classList.add('active');
    applyFilter();
  };
  bar.appendChild(d);
}

/* ── 섹션 빌드 ──────────────────────────── */
function buildSections(subjects, palMap) {
  const main = document.getElementById('mainArea');
  main.querySelectorAll('.subject-section').forEach(e => e.remove());

  subjects.forEach(subject => {
    const pal     = palMap[subject];
    const lessons = LESSONS.filter(l => l.subject === subject);
    const units   = [...new Set(lessons.map(l => l.unit))];
    const icon    = ICONS[subject] || '📄';

    const sec = document.createElement('section');
    sec.className = 'subject-section';
    sec.dataset.subject = subject;

    /* 섹션 헤더 */
    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `
      <span class="subject-badge" style="color:${pal.c};background:${pal.bg};border-color:${pal.bd}">
        ${icon} ${subject}
      </span>
      <div class="section-line"></div>
      <span class="section-cnt">${lessons.length}개</span>
    `;
    sec.appendChild(hdr);

    /* 단원 그룹 */
    units.forEach(unit => {
      const unitLessons = lessons.filter(l => l.unit === unit);
      const grp = document.createElement('div');
      grp.className = 'unit-group';
      grp.dataset.unit = unit;
      grp.innerHTML = `
        <div class="unit-label">
          <span class="unit-dot" style="background:${pal.c}"></span>
          <span class="unit-name">${unit}</span>
          <div class="unit-line"></div>
          <span class="unit-cnt">${unitLessons.length}</span>
        </div>
        <div class="card-grid"></div>
      `;
      const grid = grp.querySelector('.card-grid');
      unitLessons.forEach(l => grid.appendChild(buildCard(l, unit, pal)));
      sec.appendChild(grp);
    });

    main.insertBefore(sec, document.getElementById('emptyState'));
  });
}

/* ── 카드 ───────────────────────────────── */
function buildCard(lesson, unit, pal) {
  const a = document.createElement('a');
  a.href      = lesson.url || '#';
  a.target    = lesson.url && lesson.url !== '#' ? '_blank' : '_self';
  a.rel       = 'noopener noreferrer';
  a.className = 'lesson-card';
  a.style.setProperty('--accent', pal.c);
  a.dataset.search = (lesson.title + ' ' + (lesson.desc || '')).toLowerCase();

  const newBadge  = lesson.isNew ? `<span class="card-new">NEW</span>` : '';
  const descBlock = lesson.desc  ? `<div class="card-desc">${lesson.desc}</div>` : '';

  a.innerHTML = `
    <div class="card-meta">
      <span class="card-dot"></span>
      <span class="card-unit-label">${unit}</span>
      ${newBadge}
    </div>
    <div class="card-title">${lesson.title}</div>
    ${descBlock}
    <div class="card-footer">
      <span class="card-date">${lesson.date || ''}</span>
      <span class="card-arrow">→</span>
    </div>
  `;
  return a;
}

/* ── 필터 ───────────────────────────────── */
function applyFilter() {
  const q = searchQuery.toLowerCase();
  let anyVisible = false;

  document.querySelectorAll('.subject-section').forEach(sec => {
    if (activeTab !== 'all' && activeTab !== sec.dataset.subject) {
      sec.hidden = true; return;
    }
    let secVisible = false;
    sec.querySelectorAll('.unit-group').forEach(grp => {
      let grpVisible = false;
      grp.querySelectorAll('.lesson-card').forEach(c => {
        const match = !q || c.dataset.search.includes(q);
        c.style.display = match ? '' : 'none';
        if (match) grpVisible = true;
      });
      grp.style.display = grpVisible ? '' : 'none';
      if (grpVisible) secVisible = true;
    });
    sec.hidden = !secVisible;
    if (secVisible) anyVisible = true;
  });

  document.getElementById('emptyState').classList.toggle('show', !anyVisible);
}

function onSearch() {
  searchQuery = document.getElementById('searchInput').value;
  applyFilter();
}

window.addEventListener('scroll', () => {
  document.getElementById('backtop').classList.toggle('show', scrollY > 300);
});

init();
</script>
