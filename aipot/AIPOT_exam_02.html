<title>생성형 AI 기초 이론 · 예상문제 풀이</title>

<style>
/* ── Gold 팔레트 ── */
:root{
  --bg:#f9f6f0; --card:#ffffff;
  --surf2:#f3ede1; --surf3:#ece3d2;
  --border:#e3d8c3; --text:#1c1410; --sub:#6b5d49;
  --ac:#b45309; --ac-l:#fef6ec; --ac-b:#f3d9b5;
  --header-bg:#1a0f00; --grad-end:#d97706;
  --ok:#0d7a5f; --ok-bg:#e8f6f1; --ok-bd:#a8ddca;
  --ng:#b91c1c; --ng-bg:#fdeceb; --ng-bd:#f3b5b1;
  --shadow:0 1px 3px rgba(40,25,5,.07),0 6px 20px rgba(40,25,5,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.prog{position:fixed;top:0;left:0;height:4px;background:var(--grad-end);width:0;z-index:200;transition:width .25s ease}

.hd{background:linear-gradient(120deg,var(--header-bg),#3a2400);color:#fff;padding:34px 20px 30px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;background:radial-gradient(circle,var(--grad-end)55%,transparent 70%);opacity:.18;border-radius:50%}
.hd-inner{max-width:860px;margin:0 auto;position:relative;z-index:1}
.hd-badge{display:inline-block;font-family:'Black Han Sans';letter-spacing:1px;background:var(--grad-end);color:#1a0f00;padding:3px 14px;border-radius:20px;font-size:13px;margin-bottom:12px}
.hd-title{display:block;font-family:'Black Han Sans';font-size:30px;line-height:1.25;margin-bottom:8px}
.hd-meta{display:block;color:#f3d9b5;font-size:14px}

.wrap{max-width:860px;margin:0 auto;padding:26px 18px 80px}

.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 26px}
.dash .d{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.dash .d .n{font-family:'Black Han Sans';font-size:26px;line-height:1}
.dash .d .l{font-size:12px;color:var(--sub);margin-top:5px}
.dash .d.ok .n{color:var(--ok)} .dash .d.ng .n{color:var(--ng)}
.dash .d.sc .n{color:var(--ac)} .dash .d.dn .n{color:var(--text)}
@media(max-width:560px){.dash{grid-template-columns:repeat(2,1fr)}}

.sh{display:flex;align-items:center;gap:10px;margin:34px 0 16px}
.sh .bar{width:5px;height:26px;background:var(--ac);border-radius:3px}
.sh h2{font-family:'Black Han Sans';font-size:22px}
.sh .tag{margin-left:auto;font-size:12px;color:var(--sub);background:var(--surf2);border:1px solid var(--border);padding:3px 11px;border-radius:20px}

.q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 20px 8px;margin-bottom:18px;box-shadow:var(--shadow);position:relative}
.q .qno{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--header-bg);color:var(--grad-end);font-family:'Black Han Sans';border-radius:9px;font-size:15px;margin-right:9px;vertical-align:-7px}
.q .qtext{font-weight:700;font-size:16px;display:inline}
.q .neg{color:var(--ng);text-decoration:underline;text-underline-offset:3px;font-weight:800}

.scene{background:var(--surf2);border:1px dashed var(--border);border-left:4px solid var(--ac);border-radius:10px;padding:13px 16px;margin:13px 0;font-size:14.5px;color:#3a2e1c}
.scene ul{margin:0;padding-left:18px}
.scene li{margin:4px 0}
.scene .sp{display:block;margin:3px 0}
.scene .who{font-weight:700;color:var(--ac)}
.scene code{font-family:'JetBrains Mono';background:#fff;border:1px solid var(--ac-b);padding:1px 6px;border-radius:5px;font-size:13px;color:var(--ac)}

.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--surf2);border:1.5px solid var(--border);border-radius:11px;padding:11px 14px;cursor:pointer;font-size:15px;color:var(--text);font-family:inherit;transition:all .15s ease}
.opt:hover{border-color:var(--ac-b);background:var(--ac-l)}
.opt .mk{flex:0 0 24px;height:24px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:600;font-size:13px;color:var(--sub);transition:all .15s}
.opt .ot{flex:1;line-height:1.5;padding-top:1px}
.opt .ot small{color:var(--sub);font-family:'JetBrains Mono';font-size:12.5px}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng-bd)}
.opt.wrong .mk{background:var(--ng);border-color:var(--ng);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}

.exp{margin:6px 0 14px;border-radius:11px;overflow:hidden;border:1px solid var(--ok-bd);display:none}
.exp.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp .head{background:var(--ok);color:#fff;padding:8px 15px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.exp.miss{border-color:var(--ng-bd)}
.exp.miss .head{background:var(--ng)}
.exp .body{background:var(--ok-bg);padding:14px 16px;font-size:14.5px;color:#22321f}
.exp.miss .body{background:var(--ng-bg);color:#3a1f1d}
.exp .body b{color:var(--ac)}
.exp .why{margin-top:10px;padding-top:10px;border-top:1px dashed var(--ok-bd)}
.exp.miss .why{border-top-color:var(--ng-bd)}
.exp .why .wt{font-weight:700;font-size:13px;color:var(--sub);margin-bottom:5px}
.exp .why ul{margin:0;padding-left:17px}
.exp .why li{margin:3px 0;font-size:13.5px}
.exp .why li b{color:var(--ng)}

.retry{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);color:var(--sub);font-size:12.5px;font-family:inherit;padding:5px 12px;border-radius:18px;cursor:pointer;margin:0 0 14px;transition:all .15s}
.retry:hover{border-color:var(--ac);color:var(--ac)}

.fig{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:16px 10px;margin:14px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig .cap{font-size:12.5px;color:var(--sub);margin-top:8px}

.intro{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:8px;font-size:14.5px;color:var(--sub);box-shadow:var(--shadow)}
.intro b{color:var(--ac)}

.foot{text-align:center;color:var(--sub);font-size:13px;margin-top:40px}
.reset-all{margin-top:14px;background:var(--header-bg);color:var(--grad-end);border:none;font-family:'Noto Sans KR';font-weight:700;font-size:14px;padding:11px 26px;border-radius:24px;cursor:pointer}
.reset-all:hover{opacity:.9}

/* 프롬프트 박스 */
.pbox{background:#1a0f00;color:#f3d9b5;border-radius:10px;padding:13px 16px;margin:13px 0;font-family:'JetBrains Mono';font-size:13.5px;line-height:1.7;border-left:4px solid var(--grad-end)}
.pbox .pk{color:var(--grad-end);font-weight:700;margin-right:6px}
</style>
</head>

/* ─────────── 문제 데이터 ─────────── */
const Q2 = [
{n:1, q:'생성형 AI(Generative AI)의 정의로 가장 적절한 것을 고르시오.',

{n:2, q:'다음은 생성형 AI의 발전 과정에서 중요한 이정표를 시간순으로 나열한 것이다. 가장 올바른 순서를 고르시오.',

 expl:'<b>VAE(2013) → GAN(2014, Ian Goodfellow) → GPT(2018, OpenAI) → DALL·E(2021~)</b> 순서가 정답입니다. 변이형 자동 인코더가 가장 먼저 등장했고, 그 다음 해에 생성적 적대 신경망이 소개되었으며, GPT 모델은 2018년에 처음 발표되었고, DALL·E와 같은 텍스트-이미지 생성 모델은 2021년 이후 대중화되었습니다.'},

{n:3, q:'다음 설명에 해당하는 생성형 AI 모델 유형을 고르시오.',
 scene:'<ul><li>이 모델은 \'노이즈 추가 과정\'과 \'노이즈 제거 과정\'의 두 단계로 작동한다.</li><li>학습 단계에서는 원본 데이터에 점진적으로 노이즈를 추가하여 완전한 노이즈 상태로 만드는 방법을 학습한다.</li><li>생성 단계에서는 반대로 무작위 노이즈로부터 시작하여 점진적으로 노이즈를 제거함으로써 실제와 유사한 데이터를 생성한다.</li><li>Stable Diffusion, DALL·E 3 등이 이 유형에 속한다.</li></ul>',
 fig: DIFFUSION_SVG,
 opts:['생성적 적대 신경망(GAN)','변이형 자동 인코더(VAE)','확산 모델(Diffusion Model)','자기회귀 모델(Autoregressive Model)'],
 answer:2,
 expl:'보기에서 설명하는 모델은 <b>확산 모델(Diffusion Model)</b>입니다. 데이터에 점진적으로 노이즈를 추가하는 forward process와 노이즈를 제거하여 데이터를 복원하는 reverse process를 학습합니다. 생성 시에는 순수한 노이즈에서 시작해 학습된 역방향 과정을 통해 노이즈를 단계적으로 제거함으로써 실제와 유사한 이미지를 생성합니다. Stable Diffusion, DALL·E 3 등이 대표적입니다.',
 why:{0:'GAN은 생성자와 판별자 네트워크가 서로 경쟁하면서 학습하는 구조를 가진다.',1:'VAE는 인코더-디코더 구조를 가지며, 데이터를 압축된 잠재 공간으로 매핑한 후 재구성한다.',3:'자기회귀 모델은 이전에 생성된 요소들을 기반으로 다음 요소를 순차적으로 생성하는 모델이다.'}},

{n:4, q:'대규모 언어 모델(LLM)의 환각(Hallucination) 현상에 대한 설명으로 가장 적절한 것을 고르시오.',

{n:7, q:'다음 중 생성형 AI에 대한 적대적 공격 유형으로 올바른 것을 고르시오.',
 opts:['프롬프트 주입(Prompt Injection)','컴퓨팅 파워(Computing Power)','데이터 마스킹(Data Masking)','네트워크 해싱(Network Hashing)'],
 answer:0,

{n:8, q:'다음은 챗GPT에 적용할 수 있는 파라미터 설정 예시이다. 옳은 설명을 모두 고른 것은?',
 scene:'<ul><li>ㄱ. Temperature 값을 0으로 설정하면 모델의 응답이 더 다양해진다.</li><li>ㄴ. Top-p 값이 낮을수록 더 예측 가능한 단어만 선택된다.</li><li>ㄷ. Max Tokens는 모델이 생성할 수 있는 최대 토큰 수를 제한한다.</li><li>ㄹ. Presence Penalty는 모델이 이미 사용한 토픽을 반복할 가능성을 줄여준다.</li></ul>',
 opts:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄷ, ㄹ'],
 answer:3,
 expl:'<b>ㄴ, ㄷ, ㄹ 모두 옳은 설명</b>입니다. Top-p 값이 낮을수록 더 예측 가능한 단어만 선택되고, Max Tokens는 모델이 생성할 수 있는 최대 토큰 수를 제한하며, Presence Penalty는 모델이 이미 사용한 토픽을 반복할 가능성을 줄여줍니다. <b>ㄱ은 틀린 설명</b>으로, Temperature 값이 0이면 응답이 가장 결정적이고 일관성 있게 됩니다(다양해지지 않음).'},

{n:9, q:'트랜스포머 아키텍처의 어텐션(Attention) 메커니즘에 대한 설명으로 <span class="neg">옳지 않은</span> 것을 고르시오.',

{n:12, q:'다음 중 Word2Vec, FastText, BERT 임베딩에 관한 설명으로 가장 옳은 것은?',

       'BERT는 단어를 자모 단위로 분리하여 학습하기 때문에 한국어와 같은 교착어에서 특히 우수한 성능을 보인다.',
       'Word2Vec과 BERT는 문맥을 고려하는 동적 임베딩인 반면, FastText는 문맥과 무관한 정적 임베딩을 생성한다.'],

/* ─────────── 렌더링 ─────────── */
const answered = {};
let totalRendered = 0;

function render(list, prefix, mountId){
  const mount = document.getElementById(mountId);
  list.forEach(item=>{
    totalRendered++;
    const key = prefix + item.n;
    const card = document.createElement('div');
    card.className = 'q';
    let html = `<div><span class="qno">${item.n}</span><span class="qtext">${item.q}</span></div>`;
    if(item.scene) html += `<div class="scene">${item.scene}</div>`;
    if(item.fig) html += item.fig;

    html += `<div class="opts" id="opts-${key}">`;
    item.opts.forEach((o,i)=>{
      const mark = String.fromCharCode(9312+i);
      html += `<button class="opt" data-i="${i}" onclick="pick('${key}',${i})">
        <span class="mk">${mark}</span><span class="ot">${o}</span></button>`;
    });
    html += `</div>`;

    let whyHtml = '';
    if(item.why){
      whyHtml = `<div class="why"><div class="wt">✕ 오답 피하기</div><ul>` +
        Object.keys(item.why).map(k=>`<li><b>${String.fromCharCode(9312+(+k))}</b> ${item.why[k]}</li>`).join('') +
        `</ul></div>`;
    }
    html += `<div class="exp" id="exp-${key}">
      <div class="head" id="exph-${key}">✓ 정답 해설</div>
      <div class="body"><b>정답: ${String.fromCharCode(9312+item.answer)}</b><br>${item.expl}${whyHtml}</div>
    </div>`;
    html += `<button class="retry" id="rt-${key}" style="display:none" onclick="retry('${key}')">↻ 다시 풀기</button>`;

    card.innerHTML = html;
    card._answer = item.answer;
    mount.appendChild(card);
  });
}

function pick(key, i){
  if(answered[key]) return;
  const opts = document.getElementById('opts-'+key);
  const buttons = opts.querySelectorAll('[data-i]');
  const card = opts.closest('.q');
  const ans = card._answer;
  const correct = (i===ans);

  buttons.forEach(b=>{
    const bi = +b.dataset.i;
    b.disabled = true;
    if(bi===ans) b.classList.add('correct');
    else if(bi===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const exp = document.getElementById('exp-'+key);
  const exph = document.getElementById('exph-'+key);
  if(correct){ exp.classList.remove('miss'); exph.textContent='✓ 정답입니다! · 정답 해설'; }
  else { exp.classList.add('miss'); exph.textContent='✗ 틀렸어요 · 정답 해설'; }
  exp.classList.add('show');
  document.getElementById('rt-'+key).style.display='inline-flex';

  answered[key] = {grade: correct?'ok':'ng'};
  updateDash();
}

function retry(key){
  const opts = document.getElementById('opts-'+key);
  opts.querySelectorAll('[data-i]').forEach(b=>{
    b.disabled=false; b.classList.remove('correct','wrong','dim');
  });
  document.getElementById('exp-'+key).classList.remove('show');
  document.getElementById('rt-'+key).style.display='none';
  delete answered[key];
  updateDash();
}

function updateDash(){
  let ok=0, ng=0;
  Object.values(answered).forEach(a=>{ a.grade==='ok'?ok++:ng++; });
  const done = ok+ng;
  document.getElementById('db-ok').textContent = ok;
  document.getElementById('db-ng').textContent = ng;
  document.getElementById('db-done').textContent = done+'/'+totalRendered;
  document.getElementById('db-score').textContent = ok*5;
  document.getElementById('prog').style.width = (done/totalRendered*100)+'%';
}

function resetAll(){
  Object.keys(answered).forEach(k=>retry(k));
  window.scrollTo({top:0,behavior:'smooth'});
}

render(Q2, 'a', 'quiz-area');
render(Q1, 'b', 'quiz-area-2');
updateDash();
</script>
