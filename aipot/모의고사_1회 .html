<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>모의고사 1회 · AI/프롬프트 엔지니어링</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f6f0; --card:#ffffff; --surf2:#f3ede1;
  --border:#e3d8c3; --text:#1c1410; --sub:#6b5d49;
  --ac:#b45309; --ac-l:#fef6ec; --ac-b:#f3d9b5;
  --hd:#1a0f00; --acc:#d97706;
  --ok:#0d7a5f; --ok-bg:#e8f6f1; --ok-bd:#a8ddca;
  --ng:#b91c1c; --ng-bg:#fdeceb; --ng-bd:#f3b5b1;
  --warn-amber:#d97706; --warn-red:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.65;padding-bottom:120px}

.hd{background:linear-gradient(120deg,var(--hd),#3a2400);color:#fff;padding:26px 20px 22px}
.hd-inner{max-width:1140px;margin:0 auto;padding:0 18px}
.hd-badge{display:inline-block;font-family:'Black Han Sans';background:var(--acc);color:#1a0f00;padding:3px 14px;border-radius:20px;font-size:13px;margin-bottom:10px;letter-spacing:1px}
.hd-title{font-family:'Black Han Sans';font-size:26px;line-height:1.25;display:block}
.hd-meta{display:block;color:#f3d9b5;font-size:13px;margin-top:6px}

.name-bar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:11px 18px;z-index:50;box-shadow:0 2px 6px rgba(40,25,5,.06)}
.name-bar .inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name-bar label{font-size:13.5px;color:var(--sub);font-weight:700}
.name-bar input{flex:1;min-width:140px;font-family:inherit;font-size:15px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surf2)}
.name-bar input:focus{outline:none;border-color:var(--ac);background:#fff}
.prog{font-size:13px;color:var(--sub);white-space:nowrap}
.prog b{color:var(--ac);font-size:15px}
.timer{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:#fff;background:var(--hd);padding:7px 13px;border-radius:18px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.timer.warn-amber{background:var(--warn-amber);animation:pulseAmber 2s infinite}
.timer.warn-red{background:var(--warn-red);animation:pulseRed 1s infinite}
.timer.timeup{background:#444;color:#fff}
@keyframes pulseAmber{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulseRed{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.03)}}

.content-wrap{max-width:1140px;margin:0 auto;padding:22px 18px 60px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px}
.main-col{min-width:0}
@media (max-width:980px){
  .content-wrap{grid-template-columns:1fr}
}

.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(40,25,5,.05);scroll-margin-top:80px}
.q-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.qno{font-family:'Black Han Sans';color:var(--ac);font-size:18px}
.tag{font-size:11px;color:var(--sub);background:var(--surf2);padding:2px 9px;border-radius:18px;border:1px solid var(--border)}
.qtext{font-weight:700;font-size:15.5px;line-height:1.55;color:var(--text)}
.scene{background:var(--surf2);border:1px dashed var(--border);border-left:3px solid var(--ac);border-radius:8px;padding:11px 14px;margin-top:11px;font-size:13.5px;color:#3a2e1c}
.scene .ln{display:block;margin:2px 0}

.opts{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--surf2);border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14.5px;color:var(--text);font-family:inherit;transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--ac-b);background:var(--ac-l)}
.opt .mk{flex:0 0 22px;height:22px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--sub);transition:all .12s}
.opt .ot{flex:1;line-height:1.5;padding-top:1px}
.opt.sel{background:var(--ac-l);border-color:var(--ac)}
.opt.sel .mk{background:var(--ac);border-color:var(--ac);color:#fff}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng-bd)}
.opt.wrong .mk{background:var(--ng);border-color:var(--ng);color:#fff}
.opt.dim{opacity:.5}

.result-tag{display:inline-flex;align-items:center;gap:4px;margin-top:11px;padding:4px 11px;border-radius:14px;font-size:12.5px;font-weight:700}
.result-tag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.result-tag.ng{background:var(--ng-bg);color:var(--ng);border:1px solid var(--ng-bd)}

.expl-box{display:none;margin-top:12px;border-radius:10px;border:1px solid var(--ok-bd);overflow:hidden}
.expl-box.show{display:block}
.expl-box.ng-bg{border-color:var(--ng-bd)}
.expl-head{background:var(--ok);color:#fff;font-size:12.5px;font-weight:700;padding:6px 13px}
.expl-box.ng-bg .expl-head{background:var(--ng)}
.expl-body{background:var(--ok-bg);padding:12px 15px;font-size:13.5px;color:#22321f;line-height:1.7}
.expl-box.ng-bg .expl-body{background:var(--ng-bg);color:#3a1f1d}
.expl-body b{color:var(--ac)}

/* ── 답안 표기란 (우측 사이드바) ── */
.ans-sheet{
  position:sticky;top:80px;align-self:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 12px;box-shadow:0 1px 3px rgba(40,25,5,.05);
  max-height:calc(100vh - 100px);overflow-y:auto;
}
.ans-sheet h3{font-family:'Black Han Sans';font-size:14px;color:var(--ac);text-align:center;margin-bottom:6px;letter-spacing:1px}
.ans-sheet .sub-text{text-align:center;font-size:10.5px;color:var(--sub);margin-bottom:11px;line-height:1.4}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ans-cell{
  aspect-ratio:1;background:var(--surf2);border:1.5px dashed var(--border);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;padding:2px;
}
.ans-cell:hover{transform:scale(1.08);border-color:var(--ac)}
.ans-cell .num{font-size:9px;font-weight:600;color:var(--sub);line-height:1}
.ans-cell .mk{font-size:14px;font-weight:700;color:var(--sub);line-height:1.2;margin-top:1px}
.ans-cell.has-ans{background:var(--ac-l);border:1.5px solid var(--ac-b)}
.ans-cell.has-ans .mk{color:var(--ac)}
.ans-cell.reviewed{cursor:pointer}
.ans-cell.reviewed.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.ans-cell.reviewed.ok .mk{color:var(--ok)}
.ans-cell.reviewed.ng{background:var(--ng-bg);border-color:var(--ng-bd)}
.ans-cell.reviewed.ng .mk{color:var(--ng)}
.ans-legend{margin-top:10px;display:flex;gap:6px;font-size:10px;color:var(--sub);justify-content:center;flex-wrap:wrap}
.ans-legend .lg{display:inline-flex;align-items:center;gap:3px}
.ans-legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid}
.ans-legend .d-ok{background:var(--ac-l);border-color:var(--ac-b)}
.ans-legend .d-no{background:var(--surf2);border-color:var(--border);border-style:dashed}

/* Submit bar */
.sub-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--border);padding:13px 18px;z-index:60;box-shadow:0 -4px 14px rgba(40,25,5,.08)}
.sub-bar .inner{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sub-stat{font-size:13.5px;color:var(--sub)}
.sub-stat b{color:var(--ac);font-weight:700}
.sub-btn{background:var(--hd);color:var(--acc);border:none;font-family:inherit;font-weight:700;font-size:15px;padding:11px 30px;border-radius:24px;cursor:pointer;transition:all .15s}
.sub-btn:hover:not(:disabled){background:#3a2400}
.sub-btn:disabled{background:#e5e1d4;color:#9a8d77;cursor:not-allowed}

/* Popup */
.pop-bg{position:fixed;inset:0;background:rgba(20,12,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.pop-bg.show{display:flex}
.pop{background:#fff;border-radius:18px;padding:28px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pop h3{font-family:'Black Han Sans';font-size:22px;margin-bottom:14px;color:var(--text)}
.pop .who{color:var(--sub);font-size:14px;margin-bottom:4px}
.pop .sc{font-family:'Black Han Sans';font-size:48px;color:var(--ac);line-height:1;margin:8px 0 4px}
.pop .sc small{font-size:18px;color:var(--sub);font-family:inherit;font-weight:400}
.pop .gd{font-size:14px;color:var(--sub);margin-bottom:22px}
.pop .gd b{color:var(--ac);font-size:18px;margin-left:4px}
.pop .actions{display:flex;gap:8px;justify-content:center}
.pop button{font-family:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:22px;cursor:pointer;border:none}
.pop .b-cancel{background:var(--surf2);color:var(--sub)}
.pop .b-confirm{background:var(--hd);color:var(--acc)}
.pop .b-confirm:hover{background:#3a2400}
.pop .b-confirm:disabled{background:#9a8d77;cursor:not-allowed}
.pop .status{font-size:13px;color:var(--sub);margin-top:14px;min-height:18px}
.pop .status.ok{color:var(--ok);font-weight:700}
.pop .status.ng{color:var(--ng);font-weight:700}
.pop .timeup-msg{background:var(--ng-bg);color:var(--ng);font-size:13px;font-weight:700;padding:7px 10px;border-radius:8px;margin-bottom:10px;display:none}
.pop.timeup .timeup-msg{display:block}

/* Result banner */
.result-banner{display:none;background:linear-gradient(120deg,var(--hd),#3a2400);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px;text-align:center}
.result-banner.show{display:block}
.result-banner h2{font-family:'Black Han Sans';font-size:24px;margin-bottom:6px}
.result-banner h2 small{color:var(--acc);font-family:inherit;font-size:15px;font-weight:400;margin-left:6px}
.result-banner .big{font-family:'Black Han Sans';font-size:48px;color:var(--acc);line-height:1;margin:8px 0}
.result-banner .sub{font-size:13.5px;color:#f3d9b5}
.reviewing .opt:not(.dim){cursor:default}
</style>
</head>
<body class="taking">

<header class="hd">
  <div class="hd-inner">
    <span class="hd-badge">MOCK 1</span>
    <span class="hd-title">모의고사 1회 · AI/프롬프트 엔지니어링</span>
    <span class="hd-meta">총 40문항 · 각 2.5점 · <b>제한시간 45분</b> · 시간 종료 시 자동 제출됩니다</span>
  </div>
</header>

<div class="name-bar">
  <div class="inner">
    <label for="stu-name">학생 이름</label>

    <span class="timer" id="timer">⏱ 45:00</span>
  </div>
</div>

<div class="content-wrap">
  <main class="main-col">
    <div class="result-banner" id="result-banner">

      <div class="sub"><span id="r-ratio">0/40 정답</span> · <span id="r-grade">F</span></div>
    </div>
    <div id="quiz"></div>
  </main>

  <aside class="ans-sheet">
    <h3>답안 표기란</h3>
    <div class="sub-text">셀 클릭 시 해당 문항으로 이동</div>
    <div class="ans-grid" id="ans-grid"></div>
    <div class="ans-legend">
      <span class="lg"><span class="dot d-ok"></span>응답</span>
      <span class="lg"><span class="dot d-no"></span>미응답</span>

</div>

<div class="sub-bar" id="sub-bar">
  <div class="inner">
    <span class="sub-stat">답안 <b id="s-done">0</b>/40 · <span id="s-todo">40개 남음</span></span>

</div>

<div class="pop-bg" id="pop-bg">
  <div class="pop" id="pop">
    <div class="timeup-msg">⏰ 시험 시간이 종료되어 자동 제출됩니다</div>
    <h3 id="pop-title">제출 확인</h3>
    <div class="who" id="p-who">—</div>
    <div class="sc" id="p-score">0<small>점</small></div>
    <div class="gd"><span id="p-ratio">0/40 정답</span> · <b id="p-grade">F</b></div>
    <div class="actions">
      <button class="b-cancel" onclick="closePopup()" id="b-cancel">닫기</button>
      <button class="b-confirm" onclick="sendAndShow()" id="b-confirm">최종 제출</button>
    </div>
    <div class="status" id="send-status"></div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwsDBzpDxc4FJTPdJBbISEaHsKGiFyT3GAWt5PfAJuYl-MkeXGPgMstFn2qUO29_3cS/exec';
const LESSON_ID   = 'exam/mock_1';
const TOTAL = 40;
const TIME_LIMIT = 45 * 60;  // 45분 (초)
const QUESTIONS = [{"q":"튜링 테스트에 대한 설명으로 가장 적절한 것을 고르시오.","opts":["컴퓨터의 연산 속도를 측정하는 테스트","기계가 인간처럼 생각할 수 있는지 판단하는 테스트","프로그램의 버그를 찾아내는 테스트","인공지능의 메모리 용량을 측정하는 테스트"],"ans":1,"scene":null,"expl":"튜링 테스트는 1950년 앨런 튜링이 제안한 것으로, 기계가 인간과 구별할 수 없는 대화를 할 수 있다면 그 기계는 <b>생각할 수 있다고 간주</b>하는 테스트입니다. 기계의 지능을 평가하는 방법으로, 인간과 구별할 수 없는 수준의 대화 능력을 보여주는지를 판단하는 것이 목적입니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 인공지능이라는 용어가 처음 등장한 시기와 장소를 고르시오.","opts":["1956년 다트머스 회의","1946년 ENIAC 개발 시기","1969년 ARPANET 개발 시기","1981년 IBM PC 출시 시기"],"ans":0,"scene":null,"expl":"'인공지능(Artificial Intelligence)'이라는 용어는 <b>1956년 다트머스 대학에서 열린 여름 연구 프로젝트</b>에서 처음 사용되었습니다. 이 회의는 존 매카시, 마빈 민스키, 나다니엘 로체스터, 클로드 섀넌 등이 주도했으며, 인공지능 연구 분야의 공식적인 시작점으로 여겨집니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 초기 인공지능의 주요 목표가 아닌 것을 고르시오.","opts":["논리적 추론 능력 구현","자연어 처리","블록체인 기술 개발","문제 해결 능력 구현"],"ans":2,"scene":null,"expl":"1950년대에 시작된 초기 인공지능의 주요 목표는 인간의 지능을 모방하는 것이었고, 이는 <b>논리적 추론, 자연어 처리, 문제 해결 능력</b> 등을 포함합니다. <b>블록체인 기술은 1990년대 후반(2008년 비트코인)에 등장한 개념</b>으로, 초기 인공지능 연구의 목표와 관련이 없습니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 인공지능 발전의 첫 번째 겨울이 발생한 주된 이유를 고르시오.","opts":["하드웨어 성능 부족","현실적 한계와 과대 홍보의 괴리","인터넷의 부재","프로그래밍 언어의 한계"],"ans":1,"scene":null,"expl":"인공지능의 첫 번째 겨울은 1970년대 중반부터 1980년대 초반까지 지속되었습니다. 이 시기에 AI 연구에 대한 관심과 자금이 급격히 감소했는데, 그 주된 이유는 <b>초기의 과대 홍보로 기대했던 것과 실제 기술의 한계 사이의 괴리</b>였습니다. 라이트힐 보고서와 같은 비판적 평가가 이에 영향을 미쳤습니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 딥러닝 혁명의 시작점으로 볼 수 있는 사건을 고르시오.","opts":["AlexNet의 ImageNet 우승","ENIAC의 개발","퍼셉트론의 발명","LISP 언어의 개발"],"ans":0,"scene":null,"expl":"2012년 <b>AlexNet의 ImageNet 대회 우승</b>은 딥러닝 혁명의 시작점입니다. 이때 기존 이미지 인식 오류율을 26%에서 15%로 크게 낮추며 딥러닝의 가능성을 입증하였고, 대부분의 컴퓨터 비전 연구가 딥러닝 기반으로 전환됩니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 전문가 시스템(Expert System)의 특징이 아닌 것을 고르시오.","opts":["특정 분야의 전문 지식 활용","규칙 기반 추론","딥러닝 기술 사용","IF-THEN 규칙 적용"],"ans":2,"scene":null,"expl":"전문가 시스템은 전문가의 지식과 경험을 컴퓨터에 축적하여 문제를 해결하는 시스템입니다. <b>규칙 기반 추론과 IF-THEN 규칙</b>을 사용하며, 특정 분야의 전문 지식을 활용합니다. <b>딥러닝은 전문가 시스템과는 다른 접근 방식</b>입니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 지도학습의 예로 적절하지 않은 것을 고르시오.","opts":["이미지 분류","K-평균 군집화 ((K-mean Cluster Analysis))","스팸 메일 분류","주택 가격 예측"],"ans":1,"scene":null,"expl":"<b>K-means 클러스터링은 대표적인 비지도학습 알고리즘</b>입니다. 데이터를 유사한 특성을 가진 그룹으로 나누는 작업을 수행하며, 레이블이 없는 데이터를 사용합니다. 나머지(이미지 분류, 스팸 분류, 주택 가격 예측)는 모두 정답 레이블이 있는 지도학습의 예입니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 강화학습의 주요 구성요소가 아닌 것을 고르시오.","opts":["상태","행동","레이블","보상"],"ans":2,"scene":null,"expl":"강화학습의 주요 구성요소는 <b>에이전트, 환경, 상태, 행동, 보상</b>입니다. <b>레이블(정답)은 지도학습에서 사용되는 요소</b>로, 강화학습의 구성요소가 아닙니다.","partLabel":"AI 기초 이론"},{"q":"생성형 AI(Generative AI)의 정의로 가장 적절한 것을 고르시오.","opts":["기존 데이터를 분류하고 예측하는 데 중점을 둔 인공지능 모델이다.","주어진 데이터로부터 패턴을 학습하여 새로운 콘텐츠를 창작할 수 있는 인공지능 모델이다.","사람의 뇌 구조를 그대로 모방하여 만든 신경망 기반 인공지능이다.","오직 텍스트 데이터만 처리할 수 있는 대화형 인공지능 모델이다."],"ans":1,"scene":null,"expl":"생성형 AI는 기존 데이터에서 패턴을 학습하여 <b>새롭고 독창적인 콘텐츠(텍스트, 이미지, 음성, 영상 등)를 창작</b>할 수 있는 인공지능 모델입니다. 단순히 기존 데이터를 복제하는 것이 아니라, 학습한 패턴을 기반으로 새로운 콘텐츠를 생성하는 능력을 가집니다.","partLabel":"생성형 AI 기초"},{"q":"다음은 생성형 AI의 발전 과정에서 중요한 이정표를 시간순으로 나열한 것이다. 가장 올바른 순서를 고르시오.","opts":["ㄱ → ㄴ → ㄷ → ㄹ","ㄹ → ㄱ → ㄴ → ㄷ","ㄱ → ㄹ → ㄴ → ㄷ","ㄹ → ㄱ → ㄷ → ㄴ"],"ans":1,"scene":["ㄱ. 생성적 적대 신경망(GAN) 등장ㄴ. GPT(Generative Pre-trained Transformer) 모델 발표ㄷ. DALL·E와 같은 텍스트-이미지 생성 모델 출시ㄹ. 변이형 자동 인코더(VAE) 개발"],"expl":"<b>VAE(2013) → GAN(2014, Ian Goodfellow) → GPT(2018, OpenAI) → DALL·E(2021~)</b> 순서가 정답입니다. 변이형 자동 인코더가 가장 먼저 등장했고, 그 다음 해에 생성적 적대 신경망이 소개되었으며, GPT 모델은 2018년에 처음 발표되었고, DALL·E와 같은 텍스트-이미지 생성 모델은 2021년 이후 대중화되었습니다.","partLabel":"생성형 AI 기초"},{"q":"다음 설명에 해당하는 생성형 AI 모델 유형을 고르시오.","opts":["생성적 적대 신경망(GAN)","변이형 자동 인코더(VAE)","확산 모델(Diffusion Model)","자기회귀 모델(Autoregressive Model)"],"ans":2,"scene":["이 모델은 '노이즈 추가 과정'과 '노이즈 제거 과정'의 두 단계로 작동한다.학습 단계에서는 원본 데이터에 점진적으로 노이즈를 추가하여 완전한 노이즈 상태로 만드는 방법을 학습한다.생성 단계에서는 반대로 무작위 노이즈로부터 시작하여 점진적으로 노이즈를 제거함으로써 실제와 유사한 데이터를 생성한다.Stable Diffusion, DALL·E 3 등이 이 유형에 속한다."],"expl":"보기에서 설명하는 모델은 <b>확산 모델(Diffusion Model)</b>입니다. 데이터에 점진적으로 노이즈를 추가하는 forward process와 노이즈를 제거하여 데이터를 복원하는 reverse process를 학습합니다. 생성 시에는 순수한 노이즈에서 시작해 학습된 역방향 과정을 통해 노이즈를 단계적으로 제거함으로써 실제와 유사한 이미지를 생성합니다. Stable Diffusion, DALL·E 3 등이 대표적입니다.","partLabel":"생성형 AI 기초"},{"q":"대규모 언어 모델(LLM)의 환각(Hallucination) 현상에 대한 설명으로 가장 적절한 것을 고르시오.","opts":["검색 증강 생성(RAG), 사실 확인 메커니즘, 외부 지식 소스와의 연결 등 다양한 접근 방식으로 완화할 수 있다.","모델의 규모를 키우는 것만으로 완전히 해결될 수 있는 문제이다.","모델이 학습한 데이터를 그대로 출력하는 현상을 의미한다.","모델 크기가 작을수록 더 자주 발생하므로 큰 모델만 사용하면 해결된다."],"ans":0,"scene":null,"expl":"환각(Hallucination) 현상은 단순히 모델의 규모를 키우는 것만으로는 완전히 해결되지 않습니다. 오히려 모델 크기가 증가함에 따라 더 설득력 있는 거짓 정보를 생성할 가능성도 있습니다. 이 문제를 완화하기 위해서는 <b>검색 증강 생성(RAG), 사실 확인 메커니즘, 외부 지식 소스와의 연결</b> 등 다양한 접근 방식이 필요합니다.","partLabel":"생성형 AI 기초"},{"q":"다음 중 생성형 AI의 필수 구성 요소로 보기 어려운 것을 고르시오.","opts":["양질의 데이터셋","학습 알고리즘","컴퓨팅 자원(GPU 등)","사용자 인증 시스템"],"ans":3,"scene":null,"expl":"생성형 AI의 필수 구성 요소는 <b>데이터셋, 알고리즘, 컴퓨팅 자원</b>입니다. <b>사용자 인증 시스템은 AI 서비스의 보안과 접근 관리를 위한 요소</b>이지, 생성형 AI 자체의 필수 구성 요소는 아닙니다.","partLabel":"생성형 AI 기초"},{"q":"생성형 AI의 출력 다양성을 제어하는 파라미터인 Temperature에 대한 설명으로 가장 적절한 것을 고르시오.","opts":["값이 0에 가까울수록 더 창의적이고 다양한 응답을 생성한다.","값이 높을수록 더 예측 가능하고 일관된 응답을 생성한다.","값이 낮을수록 더 예측 가능하고, 값이 높을수록 더 다양하고 창의적인 응답을 생성한다.","모델이 생성할 수 있는 최대 토큰 수를 제한하는 파라미터이다."],"ans":2,"scene":null,"expl":"Temperature는 생성형 AI의 출력 다양성을 제어하는 파라미터입니다. <b>값이 낮을수록(0에 가까울수록) 더 예측 가능하고 일관된 응답</b>을 생성하며, <b>값이 높을수록(1 이상) 더 다양하고 창의적인 응답</b>을 생성합니다. 일반적인 대화에서는 0.7~0.9 사이의 값이 많이 사용됩니다.","partLabel":"생성형 AI 기초"},{"q":"다음 중 생성형 AI에 대한 적대적 공격 유형으로 올바른 것을 고르시오.","opts":["프롬프트 주입(Prompt Injection)","컴퓨팅 파워(Computing Power)","데이터 마스킹(Data Masking)","네트워크 해싱(Network Hashing)"],"ans":0,"scene":null,"expl":"<b>프롬프트 주입(Prompt Injection)</b>은 악의적인 사용자가 AI 시스템의 동작을 조작하기 위해 교묘한 프롬프트를 삽입하는 공격 기법입니다. 이를 통해 AI가 원래 의도와 다른 응답을 생성하도록 유도할 수 있습니다.","partLabel":"생성형 AI 기초"},{"q":"다음은 챗GPT에 적용할 수 있는 파라미터 설정 예시이다. 옳은 설명을 모두 고른 것은?","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"ans":3,"scene":["ㄱ. Temperature 값을 0으로 설정하면 모델의 응답이 더 다양해진다.ㄴ. Top-p 값이 낮을수록 더 예측 가능한 단어만 선택된다.ㄷ. Max Tokens는 모델이 생성할 수 있는 최대 토큰 수를 제한한다.ㄹ. Presence Penalty는 모델이 이미 사용한 토픽을 반복할 가능성을 줄여준다."],"expl":"<b>ㄴ, ㄷ, ㄹ 모두 옳은 설명</b>입니다. Top-p 값이 낮을수록 더 예측 가능한 단어만 선택되고, Max Tokens는 모델이 생성할 수 있는 최대 토큰 수를 제한하며, Presence Penalty는 모델이 이미 사용한 토픽을 반복할 가능성을 줄여줍니다. <b>ㄱ은 틀린 설명</b>으로, Temperature 값이 0이면 응답이 가장 결정적이고 일관성 있게 됩니다(다양해지지 않음).","partLabel":"생성형 AI 기초"},{"q":"프롬프트 엔지니어링의 정의로 가장 적절한 것을 고르시오.","opts":["컴퓨터 프로그래밍 언어를 최적화하는 기술","생성형 AI로부터 원하는 결과를 얻기 위해 프롬프트를 설계하는 기법","자연어를 기계어로 변환하는 과정","AI 모델을 학습시키는 방법론"],"ans":1,"scene":null,"expl":"프롬프트 엔지니어링은 생성형 AI 시스템이 특정하고 고품질의 출력을 생성하도록 입력을 작성, 개선 및 최적화하는 과정이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"생성형 AI의 특징으로 올바르지 않은 것을 고르시오.","opts":["방대한 데이터를 학습하여 서비스를 제공한다.","인류가 만든 다방면의 지식을 저장한다.","모든 상황에서 완벽한 결과물을 제공한다.","고품질의 결과를 얻기 위해서는 자세한 지침이 필요하다."],"ans":2,"scene":null,"expl":"생성형 AI는 완벽하지 않다. 할루시네이션, 편향성, 윤리적 문제 등 다양한 한계점이 존재한다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 중 프롬프트 엔지니어링의 핵심 요소를 고르시오.","opts":["프로그래밍 언어의 문법적 완성도","자연어로 AI의 역량을 최대한 끌어내는 것","하드웨어 최적화 기술","데이터베이스 관리 능력"],"ans":1,"scene":null,"expl":"프롬프트 엔지니어링의 핵심은 AI 모델이 사용자의 의도를 정확히 이해하고 원하는 출력을 생성하도록 자연어로 지시하는 것이다. AI와의 효과적인 커뮤니케이션을 통해 모델의 역량을 최대한 활용하는 것에 중점을 둔다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 중 자연어 처리(NLP)의 분석 단계를 순서대로 나열한 것을 고르시오.","opts":["㉠ → ㉡ → ㉢ → ㉣","㉠ → ㉡ → ㉣ → ㉢","㉢ → ㉡ → ㉠ → ㉣","㉢ → ㉡ → ㉣ → ㉠"],"ans":2,"scene":["㉠ 의미 분석 ㉡ 구문 분석 ㉢ 형태소 분석 ㉣ 화용 분석"],"expl":"<b>형태소 분석</b>(최소 의미 단위 분리) → <b>구문 분석</b>(문장 구조와 문법 관계) → <b>의미 분석</b>(단어·문장 의미 해석) → <b>화용 분석</b>(문맥·상황에 따른 실제 의미)의 순서로 진행된다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 중 자연어 처리의 주요 응용 분야가 아닌 것을 고르시오.","opts":["텍스트 분류","감정 분석","하드웨어 설계","기계 번역"],"ans":2,"scene":null,"expl":"자연어 처리(NLP)의 주요 응용 분야는 텍스트 분류, 감정 분석, 기계 번역 등이다. 하드웨어 설계는 NLP와 직접적인 관련이 없는 분야이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"NLP의 특징으로 올바른 것을 고르시오.","opts":["프로그래밍 언어만을 해석한다.","인간의 언어를 컴퓨터가 해석하도록 한다.","이미지 처리에 특화되어 있다.","수학적 계산에만 사용된다."],"ans":1,"scene":null,"expl":"NLP(자연어 처리)는 컴퓨터가 인간의 언어를 이해하고, 해석하며, 생성할 수 있도록 하는 인공지능의 한 분야이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 자연어 처리(NLP)의 단계별 처리 과정을 올바른 순서로 나열한 것을 고르시오.","opts":["㉠ → ㉡ → ㉢ → ㉣","㉡ → ㉠ → ㉢ → ㉣","㉢ → ㉡ → ㉠ → ㉣","㉣ → ㉢ → ㉡ → ㉠"],"ans":2,"scene":["㉠ 의미 분석(Semantic Analysis) ㉡ 구문 분석(Syntax Analysis)","㉢ 형태소 분석(Morphological Analysis) ㉣ 담화 분석(Discourse Analysis)"],"expl":"자연어 처리(NLP)는 단계별로 진행되며, 올바른 순서는 \"형태소 분석 → 구문 분석 → 의미 분석 → 담화 분석\"이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 보기에서 사용된 프롬프트 패턴을 고르시오.","opts":["페르소나(Persona)","생각의 사슬(Chain of Thought)","피드백 루프(Feedback Loop)","Few-shot Learning"],"ans":0,"scene":["당신은 20년 경력의 마케팅 전문가입니다.","신제품 출시를 위한 마케팅 전략을 수립해 주세요.","- (타겟 고객) 20~30대 직장인 (예산) 5천만 원 (기간) 3개월","위 조건을 바탕으로 구체적인 마케팅 계획을 작성해 주세요."],"expl":"보기의 프롬프트는 <b>페르소나(Persona)</b> 기법을 사용하고 있다. \"당신은 20년 경력의 마케팅 전문가입니다\"라는 문장으로 AI에게 특정한 역할과 전문성을 부여하고 있다. 페르소나 기법은 AI에게 구체적인 역할을 설정하여 해당 전문 분야에 적합한 답변을 유도하는 기법이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"프롬프트 전략 수립의 기본 원칙으로 적절하지 않은 것을 고르시오.","opts":["사용자의 요구사항과 목적을 명확히 파악해야 한다.","프롬프트 작성 시 모호한 표현은 AI의 창의성을 높이므로 권장된다.","결과물의 품질 기준과 평가 방법을 사전에 정의해야 한다.","프롬프트의 구조와 형식을 일관성 있게 유지해야 한다."],"ans":1,"scene":null,"expl":"프롬프트 전략 수립의 기본 원칙에는 <b>명확성, 구체성, 일관성</b>이 포함된다. 모호한 표현은 AI가 의도하지 않은 방향으로 결과를 생성할 위험이 있으므로 권장되지 않는다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"N-shot 프롬프팅에 대한 설명으로 가장 적절한 것을 고르시오.","opts":["AI에게 단 한 번의 지시만 내리는 방식이다.","여러 AI 모델에 동일한 프롬프트를 동시에 입력하는 방식이다.","프롬프트를 여러 번 반복해서 입력하는 기법이다.","AI에게 여러 예시를 제공하여 학습 방향을 안내하는 방식이다."],"ans":3,"scene":null,"expl":"N-shot 프롬프팅은 AI에게 문제와 그에 대한 해결 예시를 N개 제공하여 학습 방향을 안내하는 방식이다. <b>Zero-shot은 예시 없이, One-shot은 하나의 예시, Few-shot은 몇 개의 예시</b>를 제공하는 프롬프팅 기법이다. 이를 통해 AI는 기대하는 패턴을 학습하고 유사한 방식으로 응답할 수 있게 된다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 중 Chain of Thought 프롬프팅에 대한 설명으로 올바른 것을 모두 고르시오.","opts":["ㄱ, ㄴ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"ans":2,"scene":["ㄱ. AI가 단계적으로 추론 과정을 보여주도록 유도하는 기법이다.","ㄴ. 복잡한 문제 해결에 효과적이지만 간단한 질문에는 비효율적일 수 있다.","ㄷ. \"단계별로 생각해 보세요\" 같은 지시어를 포함하는 것이 효과적이다.","ㄹ. 모든 AI 모델에 동일한 효과를 보이며 모델 성능과는 무관하다."],"expl":"Chain of Thought 프롬프팅은 AI가 복잡한 문제를 해결할 때 단계적으로 추론 과정을 보여주도록 유도하는 기법이다. 복잡한 문제 해결에 효과적이지만 간단한 질문에는 불필요하게 길어질 수 있다. \"단계별로 생각해 보세요\", \"천천히 생각해 보세요\" 같은 지시어를 포함하면 AI가 추론 과정을 더 상세히 보여줄 수 있다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"이미지 생성 AI를 위한 프롬프트 작성 시 가장 효과적인 접근 방식을 고르시오.","opts":["간결하게 단어 몇 개만 입력한다.","원하는 스타일, 구도, 주제 등을 상세히 기술한다.","텍스트보다는 참조 이미지만 제공한다.","기술적 용어는 피하고 일상 언어만 사용한다."],"ans":1,"scene":null,"expl":"이미지 생성 AI를 위한 효과적인 프롬프트는 원하는 <b>스타일</b>(예: 수채화, 사진, 3D 렌더링), <b>구도</b>(예: 원근법, 조명, 앵글), <b>주제</b>(인물, 풍경, 사물) 등을 구체적으로 기술하는 것이 중요하다. 상세한 설명이 AI가 의도에 맞는 이미지를 생성하는 데 도움이 된다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 중 데이터 분석 및 시각화를 위한 프롬프트 작성 시 가장 중요한 요소를 고르시오.","opts":["분석 목적과 필요한 시각화 유형을 명확히 지정하는 것","최대한 적은 단어로 간결하게 요청하는 것","가능한 모든 데이터 필드를 나열하는 것","AI가 스스로 판단할 수 있도록 자유도를 높이는 것"],"ans":0,"scene":null,"expl":"데이터 분석 및 시각화를 위한 프롬프트 작성에서 가장 중요한 것은 <b>분석 목적과 필요한 시각화 유형을 명확히 지정</b>하는 것이다. 목적이 명확해야 AI가 적절한 분석 방법을 선택하고, 필요한 시각화(막대 그래프, 선 그래프, 히트맵 등)를 생성할 수 있다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 중 멀티모달 프롬프트 활용에 대한 설명으로 옳은 것을 모두 고르시오.","opts":["ㄱ, ㄴ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"ans":2,"scene":["ㄱ. 텍스트와 이미지를 함께 사용하여 AI에 입력하는 방식이다.","ㄴ. 이미지 인식 후 설명, 차트 데이터 추출 등에 효과적이다.","ㄷ. 모든 AI 모델이 멀티모달 입력을 지원한다.","ㄹ. 여러 모달리티를 결합하면 단일 모달리티보다 정확한 결과를 얻을 수 있다."],"expl":"멀티모달 프롬프트는 텍스트와 이미지 등 여러 유형의 데이터를 함께 사용하여 AI에 입력하는 방식이다. 이는 이미지 인식 후 설명, 차트에서 데이터 추출, 시각 자료 기반 질문 응답 등에 효과적이다. 단, ㄷ. <b>모든 AI 모델이 멀티모달 입력을 지원하는 것은 아니다.</b> 멀티모달 기능은 특정 모델에서만 지원된다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"코드 작성 및 디버깅을 위한 프롬프트 작성 시 가장 효과적인 접근법을 고르시오.","opts":["오류 메시지만 제공하고 해결책을 요청한다.","코드의 실행 결과만 간략히 설명한다.","원하는 기능을 자세히 설명하되 기술적 용어는 피한다.","현재 코드, 원하는 기능, 발생한 오류, 시도한 해결책을 모두 포함한다."],"ans":3,"scene":null,"expl":"코드 작성 및 디버깅을 위한 효과적인 프롬프트는 <b>현재 코드, 원하는 기능, 발생한 오류, 시도한 해결책</b>을 모두 포함해야 한다. 이러한 정보를 종합적으로 제공함으로써 AI가 문제 상황을 정확히 이해하고 적절한 해결책을 제시할 수 있다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 설명에 해당하는 확장 프로그램을 고르시오.","opts":["AIPRM","DeepL 번역","코파일럿(Copilot)","프롬프트지니"],"ans":0,"scene":["크롬 브라우저의 확장 프로그램으로, 챗GPT에서 사용할 수 있는 다양한 프롬프트 템플릿을 제공한다.","마케팅, 글쓰기, 번역 등 분야별로 미리 제작된 프롬프트를 선택하여 사용할 수 있다.","Output in, Tone, Writing Style 등의 옵션을 설정하여 원하는 형태의 결과를 얻을 수 있다."],"expl":"보기에서 설명하는 내용은 <b>AIPRM(AI-Powered Prompt Management)</b>의 특징이다. AIPRM은 챗GPT에서 사용할 수 있는 확장 프로그램으로, 사용자가 효과적인 프롬프트를 쉽게 활용할 수 있도록 다양한 템플릿과 설정 옵션을 제공한다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 중 생성형 AI의 비즈니스 도입 시 우선적으로 고려해야 할 사항을 고르시오.","opts":["기존 시스템의 완전한 대체","비용 대비 효과와 실현 가능성 분석","경쟁사의 도입 사례 모방","전체 인력의 감축 계획"],"ans":1,"scene":null,"expl":"생성형 AI를 비즈니스에 도입할 때는 <b>비용 대비 효과와 실현 가능성을 우선적으로 분석</b>해야 한다. 이는 기업의 자원을 효율적으로 활용하고 실제로 구현 가능한 솔루션을 선택하는 데 중요하다.","partLabel":"업무활용·윤리"},{"q":"다음 중 생성형 AI의 효과적인 비즈니스 활용 분야가 아닌 것을 고르시오.","opts":["고객 서비스 자동화","데이터 분석 및 인사이트 도출","인간 의사결정의 완전 대체","콘텐츠 제작 지원"],"ans":2,"scene":null,"expl":"생성형 AI는 인간의 의사결정을 완전히 대체하기보다는 보조하는 역할을 한다. 복잡한 상황에서의 판단, 윤리적 고려사항, 창의적 문제 해결 등은 여전히 <b>인간의 영역</b>이다.","partLabel":"업무활용·윤리"},{"q":"다음 중 생성형 AI 도입의 성공적인 단계별 접근 방식으로 옳은 것을 고르시오.","opts":["즉시 전면 도입 → 평가 → 수정","계획 → 파일럿 테스트 → 평가 → 확장","경쟁사 분석 → 모방 → 도입","시스템 교체 → 직원 교육 → 운영"],"ans":1,"scene":null,"expl":"생성형 AI의 성공적인 도입을 위해서는 <b>단계적 접근</b>이 필요하다. 먼저 계획을 세우고, 소규모 파일럿 테스트를 통해 효과를 검증한 후, 결과를 평가하고 필요에 따라 확장하는 방식이 권장된다.","partLabel":"업무활용·윤리"},{"q":"다음 중 생성형 AI를 통한 업무 생산성 향상의 핵심목적을 고르시오.","opts":["모든 의사결정의 AI 위임","인간 작업자의 완전 대체","반복 업무 자동화와 인간-AI 협업","하드웨어 성능 개선"],"ans":2,"scene":null,"expl":"생성형 AI를 통한 업무 생산성 향상의 핵심은 <b>반복적이고 시간 소모적인 업무를 자동화</b>하고, 인간과 AI가 협업하여 각자의 강점을 살리는 것이다. 이를 통해 업무 효율성과 생산성을 크게 향상시킬 수 있다.","partLabel":"업무활용·윤리"},{"q":"다음 중 업무 프로세스에서 생성형 AI가 완전하게 수행하기 어려운 부분을 고르시오.","opts":["24시간 운영 가능성","창의적 문제 해결력","처리 속도","데이터 기반 분석"],"ans":1,"scene":null,"expl":"생성형 AI의 주요 한계점 중 하나는 <b>창의적 문제 해결력</b>이다. AI는 기존 데이터를 기반으로 작동하기 때문에, 완전히 새로운 아이디어를 생성하거나 복잡한 맥락을 이해하는 데 한계가 있다.","partLabel":"업무활용·윤리"},{"q":"다음 중 생성형 AI가 조직 관리 시스템에 기여할 수 있는 긍정적 효과를 고르시오.","opts":["전면적인 조직 개편","직원 역량 강화와 적응 지원","기존 시스템 즉시 폐기","인력 감축"],"ans":1,"scene":null,"expl":"생성형 AI 도입 후 조직 변화 관리의 핵심은 <b>직원들의 역량을 강화</b>하고 새로운 기술에 적응할 수 있도록 지원하는 것이다. 이는 AI와 인간이 효과적으로 협업할 수 있는 환경을 조성하는 데 중요하다.","partLabel":"업무활용·윤리"},{"q":"AI 생성 콘텐츠의 저작권 관련 올바른 설명을 고르시오.","opts":["모든 AI 생성물은 저작권 보호 대상이다.","인간의 창의적 기여도가 권리 판단 기준이다.","AI가 저작권을 보유한다.","저작권에 문제가 없다."],"ans":1,"scene":null,"expl":"AI 생성 콘텐츠의 저작권은 <b>인간의 창의적 기여도에 따라 판단</b>된다. 순수하게 AI만으로 생성된 콘텐츠는 저작권 보호 대상이 되지 않지만, 인간의 창의적 개입이 있는 경우 저작권이 인정될 수 있다.","partLabel":"업무활용·윤리"},{"q":"다음 중 AI 생성 콘텐츠 활용 시 필수 확인사항을 고르시오.","opts":["데이터 출처와 라이선스","AI 모델의 가격","개발사의 규모","서버 위치"],"ans":0,"scene":null,"expl":"AI 생성 콘텐츠를 활용할 때는 해당 AI가 학습에 사용한 <b>데이터의 출처와 라이선스</b>를 반드시 확인해야 한다. 이는 저작권 침해 문제를 예방하고 윤리적인 AI 사용을 보장하는 데 중요하다.","partLabel":"업무활용·윤리"}];

      '<span class="qno">문항 ' + (qi+1).toString().padStart(2,'0') + '</span>' +
      '<span class="tag">' + escHtml(item.partLabel) + '</span></div>' +
      '<div class="qtext">' + escHtml(item.q) + '</div>';
    if (item.scene && item.scene.length) {
      html += '<div class="scene">' +
        item.scene.map(s => '<span class="ln">• ' + escHtml(s) + '</span>').join('') +
        '</div>';
    }
    html += '<div class="opts" id="opts-' + qi + '">';
    item.opts.forEach((o, oi) => {
      html += '<button class="opt" data-oi="' + oi + '" onclick="pick(' + qi + ',' + oi + ')">' +
        '<span class="mk">' + MARK[oi] + '</span>' +
        '<span class="ot">' + escHtml(o) + '</span></button>';
    });
    html += '</div>';
    html += '<div id="rt-' + qi + '"></div>';
    html += '<div class="expl-box" id="ex-' + qi + '">' +
      '<div class="expl-head" id="exh-' + qi + '">📖 해설</div>' +
      '<div class="expl-body" id="exb-' + qi + '"></div></div>';
    card.innerHTML = html;
    root.appendChild(card);
  });

  // 답안 표기란 셀
  const grid = document.getElementById('ans-grid');
  for (let qi = 0; qi < TOTAL; qi++) {
    const cell = document.createElement('div');
    cell.className = 'ans-cell';
    cell.id = 'ac-' + qi;
    cell.onclick = () => scrollToQ(qi);
    cell.innerHTML = '<span class="num">' + (qi+1).toString().padStart(2,'0') + '</span>' +
      '<span class="mk">-</span>';
    grid.appendChild(cell);
  }
}

function scrollToQ(qi) {
  const el = document.getElementById('q-' + qi);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function pick(qi, oi) {
  if (submitted || timeIsUp) return;
  answered[qi] = oi;
  document.querySelectorAll('#opts-' + qi + ' .opt').forEach(b => {
    b.classList.toggle('sel', +b.dataset.oi === oi);
  });
  // 사이드바 셀 업데이트
  const cell = document.getElementById('ac-' + qi);
  cell.classList.add('has-ans');
  cell.querySelector('.mk').textContent = MARK[oi];
  updateProgress();
}

function updateProgress() {
  const name = document.getElementById('stu-name').value.trim();
  const done = Object.keys(answered).length;
  document.getElementById('p-done').textContent = done;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-todo').textContent = (TOTAL - done) + '개 남음';
  if (submitted) return;
  // 시간 종료 시 진행률 무관하게 제출 가능
  if (timeIsUp) {
    document.getElementById('sub-btn').disabled = !name;
  } else {
    document.getElementById('sub-btn').disabled = !(name && done === TOTAL);
  }
}

function calcScore() {
  let ok = 0;
  for (let i = 0; i < TOTAL; i++) {
    if (answered[i] !== undefined && answered[i] === QUESTIONS[i].ans) ok++;
  }
  const score = Math.round(ok / TOTAL * 100);
  let grade;
  if (score >= 90) grade = 'A';
  else if (score >= 80) grade = 'B';
  else if (score >= 70) grade = 'C';
  else if (score >= 60) grade = 'D';
  else grade = 'F';
  return { ok, score, grade };
}

function openPopup() {
  const name = document.getElementById('stu-name').value.trim();
  if (!name) {
    alert('이름을 입력해주세요.');
    document.getElementById('stu-name').focus();
    return;
  }
  const { ok, score, grade } = calcScore();
  document.getElementById('p-who').textContent = name + ' 학생';
  document.getElementById('p-score').innerHTML = score + '<small>점</small>';
  document.getElementById('p-ratio').textContent = ok + '/' + TOTAL + ' 정답';
  document.getElementById('p-grade').textContent = grade + ' 등급';
  document.getElementById('send-status').textContent = '';
  document.getElementById('send-status').className = 'status';
  document.getElementById('b-confirm').disabled = false;
  document.getElementById('b-confirm').textContent = '최종 제출';
  document.getElementById('b-cancel').style.display = timeIsUp ? 'none' : '';
  document.getElementById('pop').classList.toggle('timeup', timeIsUp);
  document.getElementById('pop-title').textContent = timeIsUp ? '시간 종료' : '제출 확인';
  document.getElementById('pop-bg').classList.add('show');
}

function closePopup() {
  if (timeIsUp) return; // 시간 종료 후엔 닫기 불가
  document.getElementById('pop-bg').classList.remove('show');
}

function collectAnswers() {
  const list = [];
  for (let i = 0; i < TOTAL; i++) {
    if (answered[i] !== undefined && answered[i] === QUESTIONS[i].ans) {
      list.push('O');
    } else {
      list.push('X');
    }
  }
  return list;
}

async function sendAndShow() {
  const name = document.getElementById('stu-name').value.trim();
  const { score } = calcScore();
  const status = document.getElementById('send-status');
  const btn = document.getElementById('b-confirm');

  btn.disabled = true;
  btn.textContent = '전송 중...';
  status.textContent = '서버로 전송 중입니다...';
  status.className = 'status';

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-cache',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        lesson: LESSON_ID,
        name,
        answers: collectAnswers(),
        score: score + '점'
      })
    });
    status.textContent = '✅ 전송 완료! 잠시 후 결과 화면이 표시됩니다.';
    status.className = 'status ok';
    setTimeout(showResults, 900);
  } catch (e) {
    status.textContent = '❌ 전송 실패: ' + e.message + ' (다시 시도해주세요)';
    status.className = 'status ng';
    btn.disabled = false;
    btn.textContent = '다시 전송';
  }
}

function showResults() {
  submitted = true;
  if (timerInterval) clearInterval(timerInterval);
  document.body.classList.remove('taking');
  document.body.classList.add('reviewing');
  document.getElementById('pop-bg').classList.remove('show');

  const name = document.getElementById('stu-name').value.trim();
  const { ok, score, grade } = calcScore();

  // 결과 배너
  const banner = document.getElementById('result-banner');
  document.getElementById('r-name').innerHTML = escHtml(name) + ' <small>학생 결과</small>';
  document.getElementById('r-score').textContent = score + '점';
  document.getElementById('r-ratio').textContent = ok + '/' + TOTAL + ' 정답';
  document.getElementById('r-grade').textContent = grade + ' 등급';
  banner.classList.add('show');

  // 각 문항 정오 표시
  QUESTIONS.forEach((item, qi) => {
    const opts = document.querySelectorAll('#opts-' + qi + ' .opt');
    const userPick = answered[qi];
    opts.forEach(b => {
      const oi = +b.dataset.oi;
      b.disabled = true;
      b.classList.remove('sel');
      if (oi === item.ans) b.classList.add('correct');
      else if (oi === userPick) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const isOk = userPick === item.ans;
    document.getElementById('rt-' + qi).innerHTML =
      '<span class="result-tag ' + (isOk ? 'ok' : 'ng') + '">' +
      (isOk ? '✓ 정답' : '✗ 오답 · 정답은 ' + MARK[item.ans]) + '</span>';

    // 해설 박스
    if (item.expl) {
      const ex = document.getElementById('ex-' + qi);
      if (!isOk) ex.classList.add('ng-bg');
      document.getElementById('exh-' + qi).innerHTML = isOk ? '📖 해설' : '📖 해설 · 정답은 ' + MARK[item.ans];
      document.getElementById('exb-' + qi).innerHTML = item.expl;
      ex.classList.add('show');
    }

    // 사이드바 셀: O/X 색상으로 변경
    const cell = document.getElementById('ac-' + qi);
    cell.classList.remove('has-ans');
    cell.classList.add('reviewed', isOk ? 'ok' : 'ng');
    const mkEl = cell.querySelector('.mk');
    if (userPick !== undefined) {
      mkEl.textContent = isOk ? '○' : '✗';
    } else {
      mkEl.textContent = '✗';  // 미응답도 오답
    }
  });

  document.getElementById('sub-bar').style.display = 'none';
  document.querySelector('.name-bar').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 타이머 ──
function updateTimerDisplay() {
  const t = document.getElementById('timer');
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  t.textContent = '⏱ ' + m + ':' + String(s).padStart(2,'0');
  t.classList.remove('warn-amber','warn-red');
  if (timeLeft <= 300) t.classList.add('warn-red');         // 5분 이하
  else if (timeLeft <= 600) t.classList.add('warn-amber');  // 10분 이하
}

function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (submitted) { clearInterval(timerInterval); return; }
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      onTimeUp();
    }
  }, 1000);
}

function onTimeUp() {
  if (submitted) return;
  timeIsUp = true;
  const t = document.getElementById('timer');
  t.textContent = '⏰ 시간 종료';
  t.classList.remove('warn-amber','warn-red');
  t.classList.add('timeup');
  // 응답 잠금
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  updateProgress();

  const name = document.getElementById('stu-name').value.trim();
  if (name) {
    setTimeout(openPopup, 400);  // 자동 제출 확인 팝업
  } else {
    alert('⏰ 시험 시간이 종료되었습니다.\n이름을 입력하고 [답안 제출] 버튼을 눌러주세요.');
    document.getElementById('stu-name').focus();
  }
}

// 새로고침/탭 닫기 방지
window.addEventListener('beforeunload', function(e) {
  if (!submitted && Object.keys(answered).length > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

render();
updateProgress();
startTimer();
</script>
</body>
</html>
