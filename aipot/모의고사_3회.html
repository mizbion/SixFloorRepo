<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>모의고사 3회 · AI/프롬프트 엔지니어링</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f6f0; --card:#ffffff; --surf2:#f3ede1;
  --border:#e3d8c3; --text:#1c1410; --sub:#6b5d49;
  --ac:#b45309; --ac-l:#fef6ec; --ac-b:#f3d9b5;
  --hd:#1a0f00; --acc:#d97706;
  --ok:#0d7a5f; --ok-bg:#e8f6f1; --ok-bd:#a8ddca;
  --ng:#b91c1c; --ng-bg:#fdeceb; --ng-bd:#f3b5b1;
  --warn-amber:#d97706; --warn-red:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.65;padding-bottom:120px}

.hd{background:linear-gradient(120deg,var(--hd),#3a2400);color:#fff;padding:26px 20px 22px}
.hd-inner{max-width:1140px;margin:0 auto;padding:0 18px}
.hd-badge{display:inline-block;font-family:'Black Han Sans';background:var(--acc);color:#1a0f00;padding:3px 14px;border-radius:20px;font-size:13px;margin-bottom:10px;letter-spacing:1px}
.hd-title{font-family:'Black Han Sans';font-size:26px;line-height:1.25;display:block}
.hd-meta{display:block;color:#f3d9b5;font-size:13px;margin-top:6px}

.name-bar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:11px 18px;z-index:50;box-shadow:0 2px 6px rgba(40,25,5,.06)}
.name-bar .inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name-bar label{font-size:13.5px;color:var(--sub);font-weight:700}
.name-bar input{flex:1;min-width:140px;font-family:inherit;font-size:15px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surf2)}
.name-bar input:focus{outline:none;border-color:var(--ac);background:#fff}
.prog{font-size:13px;color:var(--sub);white-space:nowrap}
.prog b{color:var(--ac);font-size:15px}
.timer{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:#fff;background:var(--hd);padding:7px 13px;border-radius:18px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.timer.warn-amber{background:var(--warn-amber);animation:pulseAmber 2s infinite}
.timer.warn-red{background:var(--warn-red);animation:pulseRed 1s infinite}
.timer.timeup{background:#444;color:#fff}
@keyframes pulseAmber{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulseRed{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.03)}}

.content-wrap{max-width:1140px;margin:0 auto;padding:22px 18px 60px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px}
.main-col{min-width:0}
@media (max-width:980px){
  .content-wrap{grid-template-columns:1fr}
}

.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(40,25,5,.05);scroll-margin-top:80px}
.q-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.qno{font-family:'Black Han Sans';color:var(--ac);font-size:18px}
.tag{font-size:11px;color:var(--sub);background:var(--surf2);padding:2px 9px;border-radius:18px;border:1px solid var(--border)}
.qtext{font-weight:700;font-size:15.5px;line-height:1.55;color:var(--text)}
.scene{background:var(--surf2);border:1px dashed var(--border);border-left:3px solid var(--ac);border-radius:8px;padding:11px 14px;margin-top:11px;font-size:13.5px;color:#3a2e1c}
.scene .ln{display:block;margin:2px 0}

.opts{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--surf2);border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14.5px;color:var(--text);font-family:inherit;transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--ac-b);background:var(--ac-l)}
.opt .mk{flex:0 0 22px;height:22px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--sub);transition:all .12s}
.opt .ot{flex:1;line-height:1.5;padding-top:1px}
.opt.sel{background:var(--ac-l);border-color:var(--ac)}
.opt.sel .mk{background:var(--ac);border-color:var(--ac);color:#fff}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng-bd)}
.opt.wrong .mk{background:var(--ng);border-color:var(--ng);color:#fff}
.opt.dim{opacity:.5}

.result-tag{display:inline-flex;align-items:center;gap:4px;margin-top:11px;padding:4px 11px;border-radius:14px;font-size:12.5px;font-weight:700}
.result-tag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.result-tag.ng{background:var(--ng-bg);color:var(--ng);border:1px solid var(--ng-bd)}

.expl-box{display:none;margin-top:12px;border-radius:10px;border:1px solid var(--ok-bd);overflow:hidden}
.expl-box.show{display:block}
.expl-box.ng-bg{border-color:var(--ng-bd)}
.expl-head{background:var(--ok);color:#fff;font-size:12.5px;font-weight:700;padding:6px 13px}
.expl-box.ng-bg .expl-head{background:var(--ng)}
.expl-body{background:var(--ok-bg);padding:12px 15px;font-size:13.5px;color:#22321f;line-height:1.7}
.expl-box.ng-bg .expl-body{background:var(--ng-bg);color:#3a1f1d}
.expl-body b{color:var(--ac)}

/* ── 답안 표기란 (우측 사이드바) ── */
.ans-sheet{
  position:sticky;top:80px;align-self:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 12px;box-shadow:0 1px 3px rgba(40,25,5,.05);
  max-height:calc(100vh - 100px);overflow-y:auto;
}
.ans-sheet h3{font-family:'Black Han Sans';font-size:14px;color:var(--ac);text-align:center;margin-bottom:6px;letter-spacing:1px}
.ans-sheet .sub-text{text-align:center;font-size:10.5px;color:var(--sub);margin-bottom:11px;line-height:1.4}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ans-cell{
  aspect-ratio:1;background:var(--surf2);border:1.5px dashed var(--border);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;padding:2px;
}
.ans-cell:hover{transform:scale(1.08);border-color:var(--ac)}
.ans-cell .num{font-size:9px;font-weight:600;color:var(--sub);line-height:1}
.ans-cell .mk{font-size:14px;font-weight:700;color:var(--sub);line-height:1.2;margin-top:1px}
.ans-cell.has-ans{background:var(--ac-l);border:1.5px solid var(--ac-b)}
.ans-cell.has-ans .mk{color:var(--ac)}
.ans-cell.reviewed{cursor:pointer}
.ans-cell.reviewed.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.ans-cell.reviewed.ok .mk{color:var(--ok)}
.ans-cell.reviewed.ng{background:var(--ng-bg);border-color:var(--ng-bd)}
.ans-cell.reviewed.ng .mk{color:var(--ng)}
.ans-legend{margin-top:10px;display:flex;gap:6px;font-size:10px;color:var(--sub);justify-content:center;flex-wrap:wrap}
.ans-legend .lg{display:inline-flex;align-items:center;gap:3px}
.ans-legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid}
.ans-legend .d-ok{background:var(--ac-l);border-color:var(--ac-b)}
.ans-legend .d-no{background:var(--surf2);border-color:var(--border);border-style:dashed}

/* Submit bar */
.sub-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--border);padding:13px 18px;z-index:60;box-shadow:0 -4px 14px rgba(40,25,5,.08)}
.sub-bar .inner{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sub-stat{font-size:13.5px;color:var(--sub)}
.sub-stat b{color:var(--ac);font-weight:700}
.sub-btn{background:var(--hd);color:var(--acc);border:none;font-family:inherit;font-weight:700;font-size:15px;padding:11px 30px;border-radius:24px;cursor:pointer;transition:all .15s}
.sub-btn:hover:not(:disabled){background:#3a2400}
.sub-btn:disabled{background:#e5e1d4;color:#9a8d77;cursor:not-allowed}

/* Popup */
.pop-bg{position:fixed;inset:0;background:rgba(20,12,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.pop-bg.show{display:flex}
.pop{background:#fff;border-radius:18px;padding:28px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pop h3{font-family:'Black Han Sans';font-size:22px;margin-bottom:14px;color:var(--text)}
.pop .who{color:var(--sub);font-size:14px;margin-bottom:4px}
.pop .sc{font-family:'Black Han Sans';font-size:48px;color:var(--ac);line-height:1;margin:8px 0 4px}
.pop .sc small{font-size:18px;color:var(--sub);font-family:inherit;font-weight:400}
.pop .gd{font-size:14px;color:var(--sub);margin-bottom:22px}
.pop .gd b{color:var(--ac);font-size:18px;margin-left:4px}
.pop .actions{display:flex;gap:8px;justify-content:center}
.pop button{font-family:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:22px;cursor:pointer;border:none}
.pop .b-cancel{background:var(--surf2);color:var(--sub)}
.pop .b-confirm{background:var(--hd);color:var(--acc)}
.pop .b-confirm:hover{background:#3a2400}
.pop .b-confirm:disabled{background:#9a8d77;cursor:not-allowed}
.pop .status{font-size:13px;color:var(--sub);margin-top:14px;min-height:18px}
.pop .status.ok{color:var(--ok);font-weight:700}
.pop .status.ng{color:var(--ng);font-weight:700}
.pop .timeup-msg{background:var(--ng-bg);color:var(--ng);font-size:13px;font-weight:700;padding:7px 10px;border-radius:8px;margin-bottom:10px;display:none}
.pop.timeup .timeup-msg{display:block}

/* Result banner */
.result-banner{display:none;background:linear-gradient(120deg,var(--hd),#3a2400);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px;text-align:center}
.result-banner.show{display:block}
.result-banner h2{font-family:'Black Han Sans';font-size:24px;margin-bottom:6px}
.result-banner h2 small{color:var(--acc);font-family:inherit;font-size:15px;font-weight:400;margin-left:6px}
.result-banner .big{font-family:'Black Han Sans';font-size:48px;color:var(--acc);line-height:1;margin:8px 0}
.result-banner .sub{font-size:13.5px;color:#f3d9b5}
.reviewing .opt:not(.dim){cursor:default}
</style>
</head>
<body class="taking">

<header class="hd">
  <div class="hd-inner">
    <span class="hd-badge">MOCK 3</span>
    <span class="hd-title">모의고사 3회 · AI/프롬프트 엔지니어링</span>
    <span class="hd-meta">총 40문항 · 각 2.5점 · <b>제한시간 45분</b> · 시간 종료 시 자동 제출됩니다</span>
  </div>
</header>

<div class="name-bar">
  <div class="inner">
    <label for="stu-name">학생 이름</label>
    <input id="stu-name" type="text" placeholder="이름을 입력하세요" oninput="updateProgress()" maxlength="30">
    <span class="prog">진행 <b id="p-done">0</b>/40</span>
    <span class="timer" id="timer">⏱ 45:00</span>
  </div>
</div>

<div class="content-wrap">
  <main class="main-col">
    <div class="result-banner" id="result-banner">
      <h2 id="r-name">— <small>학생 결과</small></h2>
      <div class="big" id="r-score">0점</div>
      <div class="sub"><span id="r-ratio">0/40 정답</span> · <span id="r-grade">F</span></div>
    </div>
    <div id="quiz"></div>
  </main>

  <aside class="ans-sheet">
    <h3>답안 표기란</h3>
    <div class="sub-text">셀 클릭 시 해당 문항으로 이동</div>
    <div class="ans-grid" id="ans-grid"></div>
    <div class="ans-legend">
      <span class="lg"><span class="dot d-ok"></span>응답</span>
      <span class="lg"><span class="dot d-no"></span>미응답</span>
    </div>
  </aside>
</div>

<div class="sub-bar" id="sub-bar">
  <div class="inner">
    <span class="sub-stat">답안 <b id="s-done">0</b>/40 · <span id="s-todo">40개 남음</span></span>
    <button class="sub-btn" id="sub-btn" disabled onclick="openPopup()">답안 제출</button>
  </div>
</div>

<div class="pop-bg" id="pop-bg">
  <div class="pop" id="pop">
    <div class="timeup-msg">⏰ 시험 시간이 종료되어 자동 제출됩니다</div>
    <h3 id="pop-title">제출 확인</h3>
    <div class="who" id="p-who">—</div>
    <div class="sc" id="p-score">0<small>점</small></div>
    <div class="gd"><span id="p-ratio">0/40 정답</span> · <b id="p-grade">F</b></div>
    <div class="actions">
      <button class="b-cancel" onclick="closePopup()" id="b-cancel">닫기</button>
      <button class="b-confirm" onclick="sendAndShow()" id="b-confirm">최종 제출</button>
    </div>
    <div class="status" id="send-status"></div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwsDBzpDxc4FJTPdJBbISEaHsKGiFyT3GAWt5PfAJuYl-MkeXGPgMstFn2qUO29_3cS/exec';
const LESSON_ID   = 'exam/mock_3';
const TOTAL = 40;
const TIME_LIMIT = 45 * 60;  // 45분 (초)
const QUESTIONS = [{"q":"다음은 신경망에서 순전파(Forward Propagation)와 역전파(Back Propagation)에 관한 내용이다. 이에 대한 설명으로 옳지 않은 것을 고르시오.","opts":["순전파는 학습이 완료된 후에만 사용되고, 역전파는 학습 중에만 사용된다.","역전파는 체인 룰(Chain Rule)을 사용하여 각 가중치에 대한 손실 함수의 편미분을 계산한다.","대규모 신경망에서 역전파는 계산 복잡성이 높아 학습 속도가 느려질 수 있다.","심층 신경망에서 역전파는 기울기 소실(Vanishing Gradient) 문제를 일으킬 수 있다."],"ans":0,"scene":["순전파는 입력층에서 출력층으로 데이터가 전달되는 과정이다.역전파는 출력층에서 계산된 오차를 입력층 방향으로 전파하여 가중치를 조정한다.학습 과정에서 손실 함수(Loss Function)를 최소화하기 위해 경사하강법을 사용한다.역전파는 각 뉴런의 가중치가 최종 오차에 미치는 영향을 계산한다."],"expl":"<b>\"순전파는 학습이 완료된 후에만 사용된다\"는 설명은 옳지 않습니다.</b> 순전파는 학습 중에도 예측값을 계산하기 위해 사용되며, 추론(Inference) 단계에서도 사용됩니다. 학습 과정에서는 순전파를 통해 예측값을 계산한 후, 역전파를 통해 가중치를 업데이트하는 과정이 반복됩니다.","partLabel":"AI 기초 이론"},{"q":"인공지능 모델의 성능 평가 지표에 관한 설명으로 가장 적절한 것을 고르시오.","opts":["F1 점수는 정밀도와 재현율의 산술평균으로, 항상 정밀도와 재현율 중 더 높은 값에 가깝게 계산된다.","ROC 곡선에서 AUC(Area Under Curve) 값이 0.5에 가까울수록 좋은 분류 모델이다.","정확도(Accuracy)는 데이터 불균형 문제가 있는 경우에도 가장 신뢰할 수 있는 평가 지표이다.","정밀도(Precision)는 모델이 양성으로 예측한 것 중 실제 양성의 비율로, 거짓 양성(False Positive)을 최소화하는 것이 중요한 경우에 주목해야 한다."],"ans":3,"scene":null,"expl":"정밀도(Precision)는 모델이 양성으로 예측한 것 중 실제 양성의 비율(TP/(TP+FP))로, <b>거짓 양성(False Positive)을 최소화하는 것이 중요한 경우</b>에 주목해야 합니다. 예를 들어, 스팸 메일 분류에서 정상 메일을 스팸으로 잘못 분류하는 것을 최소화하려 할 때 중요한 지표입니다.","partLabel":"AI 기초 이론"},{"q":"몬테카를로 트리 탐색(MCTS) 알고리즘의 4단계 과정에 대한 설명으로 옳지 않은 것을 고르시오.","opts":["선택(Selection) 단계에서는 가장 유망한 노드를 선택한다.","확장(Expansion) 단계에서는 선택된 노드에서 새로운 자식 노드를 생성하여 탐색 공간을 넓힌다.","시뮬레이션(Simulation) 단계에서는 선택된 노드에서 무작위 정책에 따라 게임이나 문제의 결과를 얻을 때까지 진행한다.","역전파(Backpropagation) 단계에서는 모든 노드의 값을 동일하게 업데이트하여 선택 확률을 균등하게 분배한다."],"ans":3,"scene":null,"expl":"<b>역전파(Backpropagation) 단계에 대한 설명이 옳지 않습니다.</b> 역전파 단계에서는 시뮬레이션 결과를 선택된 노드부터 루트 노드까지 거슬러 올라가며 각 노드의 값을 업데이트합니다. 이때 모든 노드의 값을 동일하게 업데이트하는 것이 아니라, 시뮬레이션 결과에 따라 각 노드의 방문 횟수와 승리 횟수를 갱신하여 다음 선택 단계에서 더 정확한 의사결정을 할 수 있도록 합니다. 따라서 선택 확률이 균등하게 분배되는 것이 아니라, 더 유망한 경로에 더 높은 확률이 부여됩니다.","partLabel":"AI 기초 이론"},{"q":"다음은 GAN(Generative Adversarial Networks)의 작동 방식을 시각화한 그림이다. 빈칸 (a)~(d)에 들어갈 적절한 용어를 순서대로 나열한 것을 고르시오.","opts":["(a) 생성자(Generator) / (b) 판별자(Discriminator) / (c) 손실 함수(Loss Function) / (d) 역전파(Backpropagation)","(a) 판별자(Discriminator) / (b) 생성자(Generator) / (c) 역전파(Backpropagation) / (d) 손실 함수(Loss Function)","(a) 생성자(Generator) / (b) 판별자(Discriminator) / (c) 역전파(Backpropagation) / (d) 손실 함수(Loss Function)","(a) 판별자(Discriminator) / (b) 생성자(Generator) / (c) 손실 함수(Loss Function) / (d) 역전파(Backpropagation)"],"ans":0,"scene":null,"expl":"GAN의 각 부분에 해당하는 용어는 다음과 같습니다. <b>(a) 생성자(Generator)</b>: 무작위 노이즈를 입력으로 받아 가짜 데이터를 생성하는 신경망. <b>(b) 판별자(Discriminator)</b>: 실제 데이터와 생성자가 만든 가짜 데이터를 입력으로 받아 이를 구분하는 신경망. <b>(c) 손실 함수(Loss Function)</b>: 판별자의 출력과 실제 레이블 간의 차이를 계산하여 모델 성능을 평가하는 함수. <b>(d) 역전파(Backpropagation)</b>: 손실 함수의 결과를 바탕으로 생성자와 판별자의 파라미터를 업데이트하는 과정. 생성자는 판별자를 속이려 더 실제 같은 데이터를 생성하고, 판별자는 더 잘 구분하려 학습하는 적대적 과정을 통해 두 신경망이 함께 발전합니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 인공지능이라는 용어가 처음 등장한 시기와 장소를 고르시오.","opts":["1956년 다트머스 회의","1946년 ENIAC 개발 시기","1969년 ARPANET 개발 시기","1981년 IBM PC 출시 시기"],"ans":0,"scene":null,"expl":"'인공지능(Artificial Intelligence)'이라는 용어는 <b>1956년 다트머스 대학에서 열린 여름 연구 프로젝트</b>에서 처음 사용되었습니다. 이 회의는 존 매카시, 마빈 민스키, 나다니엘 로체스터, 클로드 섀넌 등이 주도했으며, 인공지능 연구 분야의 공식적인 시작점으로 여겨집니다.","partLabel":"AI 기초 이론"},{"q":"다음 중 전문가 시스템(Expert System)의 특징이 아닌 것을 고르시오.","opts":["특정 분야의 전문 지식 활용","규칙 기반 추론","딥러닝 기술 사용","IF-THEN 규칙 적용"],"ans":2,"scene":null,"expl":"전문가 시스템은 전문가의 지식과 경험을 컴퓨터에 축적하여 문제를 해결하는 시스템입니다. <b>규칙 기반 추론과 IF-THEN 규칙</b>을 사용하며, 특정 분야의 전문 지식을 활용합니다. <b>딥러닝은 전문가 시스템과는 다른 접근 방식</b>입니다.","partLabel":"AI 기초 이론"},{"q":"다음 설명에 해당하는 것을 고르시오.","opts":["혼동 행렬 ((Confusion Matrix))","정밀도-재현율 곡선 ((Precision-Recall Curve))","ROC 곡선 ((ROC Curve))","학습 곡선 ((Learning Curve))"],"ans":2,"scene":["이진 분류 모델의 성능을 평가하는 그래프로, 가로축은 거짓 양성률(FPR), 세로축은 참 양성률(TPR)을 나타낸다.이 곡선 아래의 면적을 AUC(Area Under Curve)라고 하며, 1에 가까울수록 모델의 성능이 우수하다.모델이 완벽할 때는 좌상단 모서리를 지나가고, 무작위 분류기는 대각선을 따라 나타난다."],"expl":"보기에서 설명하는 내용은 <b>ROC 곡선(Receiver Operating Characteristic Curve)</b>입니다. ROC 곡선은 이진 분류 모델의 성능을 시각적으로 나타내는 도구로, 곡선 아래 면적인 AUC 값으로 모델의 성능을 정량적으로 평가합니다.","partLabel":"AI 기초 이론"},{"q":"다음 설명에 해당하는 알고리즘을 고르시오.","opts":["Q-학습 ((Q-Learning))","인공신경망 ((ANN))","몬테카를로 트리 검색 ((MCTS))","탐욕 알고리즘 ((Greedy Algorithm))"],"ans":2,"scene":["프로 바둑 선수 P는 다음 수를 결정할 때마다 여러 가지 수를 무작위로 골라 게임을 끝까지 진행해본다. 이 과정을 수천 번 반복한 후, 가장 승률이 높던 수를 선택한다. 이러한 방식으로 P는 복잡한 상황에서도 최적의 수를 찾아낼 수 있었다."],"expl":"<b>MCTS(Monte Carlo Tree Search)</b>는 여러 가능성을 무작위로 시도해보고, 가장 좋은 결과를 보인 선택지를 고르는 알고리즘입니다. \"무작위로 끝까지 진행 → 수천 번 반복 → 승률 높은 수 선택\"이 MCTS의 핵심입니다.","partLabel":"AI 기초 이론"},{"q":"다음은 트랜스포머 모델의 핵심 구성 요소에 대한 설명이다. 이에 대한 설명으로 옳지 않은 것을 고르시오.","opts":["피드 포워드 네트워크는 각 위치의 토큰을 독립적으로 처리한다.","포지셔널 인코딩은 RNN과 달리 위치 정보가 없는 트랜스포머 모델의 한계를 보완한다.","인코더-디코더 구조에서 인코더는 입력을 처리하고, 디코더는 출력을 생성한다.","자기주의 메커니즘은 시퀀스의 길이가 길어질수록 계산 효율성이 증가한다."],"ans":3,"scene":["자기주의 메커니즘(Self-Attention Mechanism)은 문장 내의 각 단어가 다른 단어들과 어떻게 관련되는지를 파악한다.인코더-디코더 구조(Encoder-Decoder Structure)는 입력 시퀀스를 처리하고 출력 시퀀스를 생성하는 역할을 담당한다.포지셔널 인코딩(Positional Encoding)은 시퀀스 내 단어의 위치 정보를 모델에 제공한다.피드 포워드 네트워크(Feed Forward Network)는 자기 주의 메커니즘의 출력을 추가로 처리한다."],"expl":"자기 주의 메커니즘은 시퀀스의 길이가 <b>길어질수록 계산 복잡도가 증가하며 효율성이 감소</b>합니다. 이는 <b>시퀀스 길이의 제곱(O(n²))에 비례하는 계산량</b>이 필요하기 때문입니다. 이러한 계산 효율성 문제를 해결하기 위해 스파스 어텐션(Sparse Attention)이나 선형 어텐션(Linear Attention) 등의 기법이 개발되었습니다.","partLabel":"생성형 AI 기초"},{"q":"생성형 AI의 편향성 문제를 해결하기 위한 윤리적 관점에서 가장 적절하지 않은 것을 고르시오.","opts":["다양한 이해관계자가 참여하는 윤리 위원회를 구성하여 AI 개발 과정을 감독한다.","AI 모델의 의사결정 과정을 투명하게 공개하고 설명 가능한 AI(Explainable AI)를 구현한다.","편향성 검증을 위해 소수 집단의 의견을 배제하고 다수의 관점만을 반영한다.","정기적인 편향성 감사(Bias Audit)를 실시하여 사회적 공정성을 지속적으로 모니터링한다."],"ans":2,"scene":null,"expl":"생성형 AI의 편향성 문제 해결을 위한 윤리적 접근은 <b>포용성, 투명성, 책임성</b>을 핵심 원칙으로 합니다. 특히 <b>사회적 약자나 소수 집단의 관점을 적극적으로 반영</b>하여 AI 시스템이 모든 사용자에게 공정하게 작동하도록 보장해야 합니다. 소수 의견을 배제하는 것은 오히려 편향을 강화합니다.","partLabel":"생성형 AI 기초"},{"q":"다음은 생성형 AI가 직면한 도전과제들이다. 이에 대한 설명 중 옳은 것을 고르시오.","opts":["계산 효율성 문제는 양자 컴퓨팅의 상용화로 인해 더 이상 중요한 도전 과제가 아니다.","생성형 AI의 편향성은 데이터 전처리 단계에서만 해결할 수 있으며, 모델 학습 후에는 수정이 불가능하다.","대규모 언어 모델의 블랙박스 특성으로 인해 설명 가능성은 여전히 중요한 연구 분야이다.","대규모 언어 모델의 환각 현상은 현재까지 완전히 해결된 문제이다."],"ans":2,"scene":["ㄱ. 환각(Hallucination) - 모델이 실제로 존재하지 않는 정보를 사실인 것처럼 생성하는 현상ㄴ. 편향성(Bias) - 학습 데이터에 내재된 편향이 모델의 출력에 반영되는 현상ㄷ. 설명 가능성(Explainability) - 모델이 특정 출력을 생성한 이유나 과정을 명확히 설명하기 어려운 문제ㄹ. 계산 효율성(Computational Efficiency) - 대규모 모델의 학습과 추론에 필요한 계산 자원의 문제"],"expl":"대규모 언어 모델의 <b>블랙박스 특성으로 인한 설명 가능성(Explainability) 문제는 여전히 중요한 연구 분야</b>입니다. 모델이 왜 특정 출력을 생성했는지, 내부적으로 어떤 추론 과정을 거쳤는지 이해하기 어려운 점은 특히 금융, 의료, 법률 등 중요한 결정을 내리는 분야에서 AI의 적용을 제한하는 요소입니다. 이를 해결하기 위한 해석 가능한 AI(Interpretable AI)와 설명 가능한 AI(XAI) 연구가 활발히 진행 중입니다.","partLabel":"생성형 AI 기초"},{"q":"생성형 AI(Generative AI)의 정의로 가장 적절한 것을 고르시오.","opts":["기존 데이터를 분류하고 예측하는 데 중점을 둔 인공지능 모델이다.","주어진 데이터로부터 패턴을 학습하여 새로운 콘텐츠를 창작할 수 있는 인공지능 모델이다.","사람의 뇌 구조를 그대로 모방하여 만든 신경망 기반 인공지능이다.","오직 텍스트 데이터만 처리할 수 있는 대화형 인공지능 모델이다."],"ans":1,"scene":null,"expl":"생성형 AI는 기존 데이터에서 패턴을 학습하여 <b>새롭고 독창적인 콘텐츠(텍스트, 이미지, 음성, 영상 등)를 창작</b>할 수 있는 인공지능 모델입니다. 단순히 기존 데이터를 복제하는 것이 아니라, 학습한 패턴을 기반으로 새로운 콘텐츠를 생성하는 능력을 가집니다.","partLabel":"생성형 AI 기초"},{"q":"다음 중 생성형 AI의 필수 구성 요소로 보기 어려운 것을 고르시오.","opts":["양질의 데이터셋","학습 알고리즘","컴퓨팅 자원(GPU 등)","사용자 인증 시스템"],"ans":3,"scene":null,"expl":"생성형 AI의 필수 구성 요소는 <b>데이터셋, 알고리즘, 컴퓨팅 자원</b>입니다. <b>사용자 인증 시스템은 AI 서비스의 보안과 접근 관리를 위한 요소</b>이지, 생성형 AI 자체의 필수 구성 요소는 아닙니다.","partLabel":"생성형 AI 기초"},{"q":"트랜스포머 아키텍처의 어텐션(Attention) 메커니즘에 대한 설명으로 옳지 않은 것을 고르시오.","opts":["셀프 어텐션은 입력 시퀀스의 모든 요소 간 관계를 계산한다.","멀티헤드 어텐션은 여러 어텐션 계산을 병렬로 수행하지 않는다.","셀프 어텐션 메커니즘은 Query, Key, Value 벡터를 사용한다.","셀프 어텐션은 같은 시퀀스 내 요소들 간의 관계를 계산한다."],"ans":1,"scene":null,"expl":"<b>멀티헤드 어텐션은 여러 어텐션 계산을 병렬로 수행하는 메커니즘</b>입니다. \"병렬로 수행하지 않는다\"는 설명은 틀렸습니다. 각 헤드는 입력의 다른 부분에 집중할 수 있어 다양한 특성을 포착할 수 있게 해줍니다.","partLabel":"생성형 AI 기초"},{"q":"다음 프롬프트를 챗GPT한테 입력했을 때 기대할 수 있는 결과로 적절한 것을 고르시오.","opts":["라면을 끓이는 방법을 일반적으로 알려준다.","일류호텔 주방장 역할로 라면을 맛있게 끓이는 방법을 알려준다.","일류호텔 주방장 역할로 다양한 고급 라면 레시피를 알려준다.","일류호텔 주방장 역할을 수행하지 않는다."],"ans":2,"scene":["[프롬프트]당신은 일류호텔 주방장입니다.라면을 맛있게 끓이는 방법에 대해 알려주세요. Temperature : 0.7"],"expl":"해당 프롬프트에서는 <b>\"당신은 일류호텔 주방장입니다\"라는 역할 지정</b>과 함께 <b>Temperature 값을 0.7</b>로 설정했습니다. 이는 적당한 창의성을 가진 응답을 생성하도록 하는 설정입니다. 따라서 챗GPT는 일류호텔 주방장 역할로 <b>다양한 고급 라면 레시피</b>를 알려줄 것입니다.","partLabel":"생성형 AI 기초"},{"q":"다음 설명에 해당하는 것을 고르시오.","opts":["빔 서치(Beam Search)","Top-p","빈도 페널티(Frequency Penalty)","그리디 디코딩(Greedy Decoding)"],"ans":1,"scene":["모델이 다음 단어를 선택할 때 상위 확률 토큰들의 누적 분포를 제한하는 방식으로 동작한다.값이 0.9라면, 누적 확률이 90%에 도달할 때까지의 토큰들만 고려한다.Temperature와 함께 사용되어 텍스트 생성의 다양성과 일관성을 조절한다.핵 샘플링(Nucleus Sampling)이라고도 불린다."],"expl":"보기에서 설명하는 것은 <b>'Top-p' 또는 '핵 샘플링(Nucleus Sampling)'</b> 파라미터입니다. 모델이 다음 토큰을 선택할 때 확률이 높은 토큰들의 누적 확률이 지정된 값(예: 0.9)에 도달할 때까지의 토큰들만 고려하는 방식입니다. 너무 희귀한 토큰들을 제외시키면서도 다양성을 유지할 수 있게 해줍니다.","partLabel":"생성형 AI 기초"},{"q":"다음은 프롬프트의 구성요소별 작성 예시이다. 각 예시가 나타내는 프롬프트 구성요소를 순서대로 나열한 것을 고르시오.","opts":["(A) 제약조건 / (B) 지시 / (C) 입력 데이터 / (D) 맥락 정보 / (E) 출력 형식","(A) 지시 / (B) 맥락 정보 / (C) 입력 데이터 / (D) 출력 형식 / (E) 제약조건","(A) 맥락 정보 / (B) 지시 / (C) 출력 형식 / (D) 입력 데이터 / (E) 제약조건","(A) 입력 데이터 / (B) 제약조건 / (C) 맥락 정보 / (D) 지시 / (E) 출력 형식"],"ans":1,"scene":["A. \"당신은 B2B 소프트웨어 회사의 마케팅 전문가입니다.\"","B. \"제품명: CloudGuard Pro, 출시일: 2024년 3월 15일, 주요 고객: 중소기업 IT 관리자\"","C. \"경쟁사 대비 비용 절감: 35%, 구축 시간: 기존 2주 → 3일, 초기 베타 테스트 고객 만족도: 95%\"","D. \"분량: 800-1000자, 구성: 헤드라인/리드/본문/인용구, 포함: 수치 데이터 최소 3개\"","E. \"전문 용어 최소화, 과장된 홍보성 표현 제외, 구체적 가격 정보 제외\""],"expl":"A: <b>지시(Instruction)</b> — 모델이 어떤 역할을 맡아 어떤 작업을 수행할지 명시. B: <b>맥락 정보(Context)</b> — 작업의 배경과 관련 정보 제공. C: <b>입력 데이터(Input Data)</b> — 모델이 처리해야 할 구체적인 데이터. D: <b>출력 형식(Output Format)</b> — 원하는 결과물의 형태와 구성 지정. E: <b>제약조건(Constraint)</b> — 결과물 생성 시 적용해야 할 제한사항.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음은 생성형 AI 모델을 다루는 파라미터(parameter)와 관련된 설명이다. ( ) 안에 들어갈 적절한 용어와 그 값의 특성을 올바르게 짝지은 것을 고르시오.","opts":["(A) Temperature / (B) 보수적이고 결정적인 / (C) 창의적이고 다양한 / (D) Top-p (Nuclear sampling)","(A) Top-p (Nuclear sampling) / (B) 창의적이고 다양한 / (C) 보수적이고 결정적인 / (D) Temperature","(A) Temperature / (B) 창의적이고 다양한 / (C) 보수적이고 결정적인 / (D) Top-k","(A) Top-k / (B) 보수적이고 결정적인 / (C) 창의적이고 다양한 / (D) Temperature"],"ans":0,"scene":["생성형 AI 모델의 출력 다양성을 제어하는 가장 대표적인 파라미터는 ( A )이다.","이 값이 0에 가까울수록 AI는 ( B ) 성향을 보이며, 2.0에 가까울수록 ( C ) 성향을 보인다.","한편 ( D )은/는 상위 몇 퍼센트의 확률 분포 내에서만 토큰을 선택하도록 제한하는 파라미터로, 이 값이 낮을수록 AI의 응답이 더 집중되고 일관성 있게 나타난다."],"expl":"A: <b>Temperature</b> — 출력의 무작위성을 조절하는 대표적 파라미터. B: 보수적이고 결정적인 — Temperature가 0에 가까울수록 모델은 가장 확률이 높은 토큰만 선택하여 보수적이고 일관된 결과를 생성. C: 창의적이고 다양한 — Temperature가 2.0에 가까울수록 모델은 확률이 낮은 토큰도 선택할 가능성이 높아져 다양하고 예측하기 어려운 결과를 생성. D: <b>Top-p(Nucleus sampling)</b> — 상위 확률 분포 내에서만 토큰을 선택하도록 제한.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음은 특정 AI 기술에 관한 설명이다. 해당하는 AI 기술과 그에 대한 특징으로 옳지 않은 것을 고르시오.","opts":["이 기술은 트랜스포머(Transformer) 아키텍처로, 기존 RNN의 장거리 의존성 학습 한계를 해결했다.","트랜스포머는 입력 시퀀스를 병렬 처리할 수 있어 학습 효율성이 높으며, 긴 시퀀스 처리에 유리하다.","GPT 계열 모델은 트랜스포머의 인코더와 디코더를 모두 사용하는 양방향 모델로, 문맥을 완전히 이해한다.","트랜스포머의 자기 집중 메커니즘은 문장 내 모든 단어 쌍 간의 관계를 직접적으로 모델링할 수 있다."],"ans":2,"scene":["이 기술은 2017년 \"Attention Is All You Need\" 논문에서 처음 소개되었으며, 기존의 순환 신경망(RNN)과 합성곱 신경망(CNN)의 한계를 극복했다. 핵심 구성 요소로는 (1) 문장 내 모든 단어 간의 관계를 동시에 고려하는 자기 집중(Self-Attention) 메커니즘, (2) 서로 다른 표현 공간에서 단어 간 관계를 학습하는 멀티헤드 어텐션(Multi-Head Attention), (3) 문장 내 단어의 순서 정보를 유지하기 위한 포지셔널 인코딩(Positional Encoding)이 있다.","이 기술은 GPT, BERT와 같은 현대 거대 언어 모델(LLM)의 근간이 되었으며, 텍스트 생성, 기계 번역, 질의응답 등 다양한 자연어 처리 태스크에서 혁신적인 성능 향상을 이끌었다."],"expl":"GPT 계열 모델은 트랜스포머의 인코더와 디코더를 모두 사용하는 양방향 모델이라는 설명은 옳지 않다. 실제로 GPT(Generative Pre-trained Transformer) 계열 모델은 <b>트랜스포머의 디코더 부분만을 사용하는 단방향(왼쪽에서 오른쪽) 모델</b>이다. 이전 단어들만 고려하여 다음 단어를 예측하는 자기회귀(auto-regressive) 방식으로 작동한다. 반면, BERT는 트랜스포머의 인코더 부분을 활용한 양방향 모델이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음은 프롬프트 안티패턴(Anti-pattern)에 관한 설명이다. ( ) 안에 들어갈 가장 적절한 용어를 고르시오.","opts":["(A) 프롬프트 주입 (Prompt Injection) / (B) 프롬프트 재구성 (Prompt Jailbreaking) / (C) 패치 가드 (Patch Guard)","(A) 프롬프트 스푸핑 (Prompt Spoofing) / (B) 프롬프트 위조 (Prompt Forgery) / (C) 레드팀 테스팅 (Red Team Testing)","(A) 프롬프트 주입 (Prompt Injection) / (B) 프롬프트 탈옥 (Prompt Jailbreaking) / (C) 레드팀 테스팅 (Red Team Testing)","(A) 프롬프트 오버라이딩 (Prompt Overriding) / (B) 프롬프트 탈옥 (Prompt Jailbreaking) / (C) 적대적 훈련 (Adversarial Training)"],"ans":2,"scene":["프롬프트 엔지니어링에서 ( A )은/는 사용자가 AI 모델에게 특정 보안 제약이나 가이드라인을 무시하도록 유도하는 기법이다. 예를 들어 \"이전 지시는 무시하고…\"와 같은 문구로 시작하는 메시지는 이러한 공격 방식의 대표적 사례이다.","반면 ( B )은/는 사용자가 악의적 용도로 AI 모델의 윤리적 경계를 우회하기 위해 간접적인 표현, 비유, 또는 다른 언어를 사용하는 방식이다. 이러한 안티패턴은 서비스 제공자들이 ( C ) 기법을 통해 방어하는데, 이는 모델 자체에 안전장치를 내장하여 유해한 요청을 인식하고 거부하도록 하는 방법이다."],"expl":"A: <b>프롬프트 주입(Prompt Injection)</b> — 사용자가 AI 모델에게 특정 보안 제약이나 가이드라인을 무시하도록 유도. B: <b>프롬프트 탈옥(Prompt Jailbreaking)</b> — 사용자가 악의적 용도로 AI 모델의 윤리적 경계를 우회하기 위해 간접적인 표현, 비유, 또는 다른 언어를 사용. C: <b>레드팀 테스팅(Red Team Testing)</b> — 모델 자체에 안전장치를 내장하여 유해한 요청을 인식하고 거부하도록 하는 방법.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 중 프롬프트 엔지니어링의 핵심 요소를 고르시오.","opts":["프로그래밍 언어의 문법적 완성도","자연어로 AI의 역량을 최대한 끌어내는 것","하드웨어 최적화 기술","데이터베이스 관리 능력"],"ans":1,"scene":null,"expl":"프롬프트 엔지니어링의 핵심은 AI 모델이 사용자의 의도를 정확히 이해하고 원하는 출력을 생성하도록 자연어로 지시하는 것이다. AI와의 효과적인 커뮤니케이션을 통해 모델의 역량을 최대한 활용하는 것에 중점을 둔다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 자연어 처리(NLP)의 단계별 처리 과정을 올바른 순서로 나열한 것을 고르시오.","opts":["㉠ → ㉡ → ㉢ → ㉣","㉡ → ㉠ → ㉢ → ㉣","㉢ → ㉡ → ㉠ → ㉣","㉣ → ㉢ → ㉡ → ㉠"],"ans":2,"scene":["㉠ 의미 분석(Semantic Analysis) ㉡ 구문 분석(Syntax Analysis)","㉢ 형태소 분석(Morphological Analysis) ㉣ 담화 분석(Discourse Analysis)"],"expl":"자연어 처리(NLP)는 단계별로 진행되며, 올바른 순서는 \"형태소 분석 → 구문 분석 → 의미 분석 → 담화 분석\"이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음 중 프롬프트 작성 시 고려해야 할 요소를 고르시오.","opts":["명확성과 구체성","프로그래밍 언어의 종류","컴퓨터의 처리 속도","운영체제의 종류"],"ans":0,"scene":null,"expl":"프롬프트 작성 시 가장 중요하게 고려해야 할 요소는 <b>명확성과 구체성</b>이다. 이는 AI가 사용자의 의도를 정확히 이해하고 원하는 결과를 생성하는 데 필수적이다.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음은 생성형 AI에 대한 프롬프트 패턴 유형에 관한 설명이다. 이를 읽고 ( ) 안에 들어갈 기법을 올바르게 연결한 것을 고르시오.","opts":["(A) 역할 부여 (Role Assignment) / (B) 생각의 사슬 (Chain of Thought) / (C) 제로샷 (Zero-shot) / (D) 퓨샷 (Few-shot)","(A) 생각의 사슬 (Chain of Thought) / (B) 역할 부여 (Role Assignment) / (C) 퓨샷 (Few-shot) / (D) 제로샷 (Zero-shot)","(A) 역할 부여 (Role Assignment) / (B) 생각의 사슬 (Chain of Thought) / (C) 퓨샷 (Few-shot) / (D) 제로샷 (Zero-shot)","(A) 퓨샷 (Few-shot) / (B) 제로샷 (Zero-shot) / (C) 역할 부여 (Role Assignment) / (D) 생각의 사슬 (Chain of Thought)"],"ans":0,"scene":["프롬프트 패턴의 유형 중 ( A )은/는 모델에게 특정 역할을 부여하여 해당 역할에 맞는 관점과 전문성을 가지고 응답하도록 하는 기법이다.","반면 ( B )은/는 복잡한 문제를 해결할 때 모델이 중간 추론 과정을 단계별로 보여주도록 유도하는 기법이다.","데이터셋 없이 모델에게 질문하는 ( C ) 기법과 달리, ( D ) 기법은 하나 이상의 예시를 제공하여 모델이 패턴을 학습하도록 한다."],"expl":"A: <b>역할 부여(Role Assignment)</b> — 모델에게 특정 역할을 부여하여 해당 역할에 맞는 관점과 전문성을 가지고 응답하도록 함. B: <b>생각의 사슬(Chain of Thought)</b> — 복잡한 문제를 해결할 때 중간 추론 과정을 단계별로 보여주도록 유도. C: <b>제로샷(Zero-shot)</b> — 데이터셋 없이 모델에게 질문. D: <b>퓨샷(Few-shot)</b> — 하나 이상의 예시를 제공하여 모델이 패턴을 학습하도록 함.","partLabel":"프롬프트 엔지니어링 기초"},{"q":"다음은 프롬프트 엔지니어링 기법에 관한 설명이다. ( A )와 ( B )에 들어갈 내용으로 가장 적절한 것을 고르시오.","opts":["A: 메타 프롬프팅  /  B: 다단계 프롬프팅","A: 자기성찰 프롬프팅  /  B: 추론 분해","A: 자기성찰 프롬프팅  /  B: 인터랙티브 프롬프팅","A: 피드백 루프  /  B: 추론 분해"],"ans":2,"scene":["( A )은/는 AI가 생성한 결과물을 평가하고 개선하도록 하는 프롬프트 기법으로, 초기 응답에 대한 비판적 분석을 통해 정확도와 품질을 향상시킨다.","반면 ( B )은/는 어려운 문제를 여러 하위 문제로 분해하여 순차적으로 해결하는 접근법으로, 각 단계의 결과를 활용해 최종 해답에 도달한다."],"expl":"A: <b>자기성찰 프롬프팅(Self-reflection prompting)</b> — AI가 자신의 응답을 비판적으로 평가하고 개선하도록 하는 기법. B: <b>인터랙티브 프롬프팅(Interactive prompting)</b> — 복잡한 문제를 여러 단계로 나누어 순차적으로 해결하는 접근법. 각 단계에서 AI의 응답을 받고, 그 결과를 기반으로 다음 단계를 진행한다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"AI를 활용한 효과적인 코드 디버깅을 위한 프롬프트 작성법에 관한 설명이다. 다음 중 가장 적절하지 않은 것을 고르시오.","opts":["에러 메시지 전체와 발생 상황을 정확히 기술해야 한다.","디버깅 목적의 프롬프트에는 코드의 실행 환경 정보를 포함해야 한다.","코드 수정 시 보안과 성능 최적화는 고려하지 않고 기능 구현에만 집중해야 한다.","이전에 시도한 해결 방법과 그 결과를 함께 제공하는 것이 효과적이다."],"ans":2,"scene":null,"expl":"코드 디버깅을 위한 프롬프트 작성에서 가장 적절하지 않은 것은 \"코드 수정 시 보안과 성능 최적화는 고려하지 않고 기능 구현에만 집중해야 한다\"는 내용이다. 실제로는 코드 디버깅과 수정 과정에서 <b>기능 구현뿐만 아니라 보안 취약점, 성능 최적화, 코드 가독성 등을 함께 고려</b>하는 것이 중요하다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 AI 생성 결과물을 생성할 때, 사용된 프롬프트에서 적용되지 않은 기법을 고르시오.","opts":["Temperature 설정을 통한 창의성 조절","구조화된 출력 형식 지정","역할 부여(Role Assignment)","구체적인 수치와 기간 명시 요구"],"ans":0,"scene":["**마케팅 담당자의 SNS 전략**","1. **타겟**: 20~30대, 인스타그램 중심","2. **콘텐츠**: 일상 활용 스토리","3. **목표**: 참여율 5% 이상","예산 : 월 500만 원 / 기간 : 3개월","※ ** 로 감싸진 글자는 굵음 처리된 것"],"expl":"결과물을 분석하면 마케팅 담당자 역할 부여, 구조화된 형식(번호, 굵은 글씨 등), 구체적 수치 명시 등이 적용되었음을 알 수 있다. 하지만 <b>Temperature 설정은 모델 내부 파라미터로 결과물만으로는 직접적으로 확인할 수 없는 기법</b>이다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음은 Midjourney와 같은 이미지 생성 AI를 위한 프롬프트 작성에 관한 설명이다. 가장 적절하지 않은 것을 고르시오.","opts":["이미지 생성 프롬프트에서 \"cinematic lighting\", \"photorealistic\", \"8k resolution\"과 같은 수식어는 이미지 품질 향상에 도움을 준다.","이미지 생성 AI는 텍스트 프롬프트의 단어 순서에 영향을 받지 않으므로 키워드를 나열하는 순서는 중요하지 않다.","\"--no hands\", \"--no text\"와 같은 부정적 프롬프트 파라미터를 사용하여 특정 요소가 이미지에 포함되지 않도록 제어할 수 있다.","참조 이미지와 텍스트 프롬프트를 함께 사용하는 것은 특정 스타일이나 구도를 더 정확하게 반영하는 데 효과적이다."],"ans":1,"scene":null,"expl":"이미지 생성 AI에서 단어 순서는 생성 결과에 영향을 미친다. Midjourney를 포함한 대부분의 이미지 생성 AI는 프롬프트의 <b>앞부분에 위치한 단어나 구문에 더 높은 가중치를 부여</b>하는 경향이 있다. 따라서 가장 중요한 요소(주제, 스타일, 분위기 등)를 프롬프트의 앞부분에 배치하고, 세부 사항이나 덜 중요한 요소는 뒤쪽에 배치하는 것이 효과적이다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"이미지 생성 AI를 위한 프롬프트 작성 시 가장 효과적인 접근 방식을 고르시오.","opts":["간결하게 단어 몇 개만 입력한다.","원하는 스타일, 구도, 주제 등을 상세히 기술한다.","텍스트보다는 참조 이미지만 제공한다.","기술적 용어는 피하고 일상 언어만 사용한다."],"ans":1,"scene":null,"expl":"이미지 생성 AI를 위한 효과적인 프롬프트는 원하는 <b>스타일</b>(예: 수채화, 사진, 3D 렌더링), <b>구도</b>(예: 원근법, 조명, 앵글), <b>주제</b>(인물, 풍경, 사물) 등을 구체적으로 기술하는 것이 중요하다. 상세한 설명이 AI가 의도에 맞는 이미지를 생성하는 데 도움이 된다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 설명에 해당하는 확장 프로그램을 고르시오.","opts":["AIPRM","DeepL 번역","코파일럿(Copilot)","프롬프트지니"],"ans":0,"scene":["크롬 브라우저의 확장 프로그램으로, 챗GPT에서 사용할 수 있는 다양한 프롬프트 템플릿을 제공한다.","마케팅, 글쓰기, 번역 등 분야별로 미리 제작된 프롬프트를 선택하여 사용할 수 있다.","Output in, Tone, Writing Style 등의 옵션을 설정하여 원하는 형태의 결과를 얻을 수 있다."],"expl":"보기에서 설명하는 내용은 <b>AIPRM(AI-Powered Prompt Management)</b>의 특징이다. AIPRM은 챗GPT에서 사용할 수 있는 확장 프로그램으로, 사용자가 효과적인 프롬프트를 쉽게 활용할 수 있도록 다양한 템플릿과 설정 옵션을 제공한다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음 코드에서 사용된 데이터 형식을 고르시오.","opts":["XML","JSON","CSV","HTML"],"ans":1,"scene":["— 코드 —","{ \"name\": \"김철수\",","  \"age\": 25,","  \"skills\": [\"Python\", \"JavaScript\", \"HTML\"],","  \"isStudent\": true,","  \"address\": {","    \"city\": \"서울\",","    \"district\": \"강남구\"","  }","}"],"expl":"제시된 코드는 <b>JSON(JavaScript Object Notation)</b> 형식으로 작성되어 있다. JSON은 중괄호 {}로 객체를 감싸고, 키와 값을 콜론(:)으로 구분하며, 여러 항목을 쉼표(,)로 나열하는 구조적 특징을 가진다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음은 Chain of Thought 프롬프팅에 관한 서술이다. 잘못된 것을 고르시오.","opts":["Chain of Thought는 단계적 추론을 유도하여 복잡한 문제 해결 능력을 향상시킨다.","Chain of Thought 기법은 모든 AI 모델에서 동일한 성능 향상을 보장한다.","수학적 문제나 다단계 추론이 필요한 작업에 효과적이다.","\"단계별로 생각해 보세요\"와 같은 명시적 지시어가 효과를 높일 수 있다."],"ans":1,"scene":null,"expl":"Chain of Thought 기법은 모든 AI 모델에서 동일한 성능 향상을 보장하지 않는다. 이 기법의 효과는 모델의 크기, 학습 방식, 아키텍처에 따라 크게 달라진다. 특히 <b>대규모 언어 모델(LLM)에서 더 효과적</b>이며, 작은 모델에서는 제한적인 효과를 보이거나 오히려 성능이 저하될 수 있다.","partLabel":"프롬프트 엔지니어링 활용"},{"q":"다음은 생성형 AI의 상업적 활용에 관한 법적 고려사항을 설명한 것이다. 잘못된 것을 고르시오.","opts":["AI가 생성한 저작물을 상업적으로 활용할 경우, 각 국가의 저작권법과 판례에 따라 다른 법적 해석이 적용될 수 있다.","AI 학습에 사용된 원본 콘텐츠의 저작권 침해 가능성은 공정 이용(Fair Use) 원칙에 따라 판단될 수 있다.","생성형 AI 산출물은 모든 국가에서 일관되게 저작권 보호 대상으로 인정된다.","AI 생성 콘텐츠를 상업적으로 활용할 때는 이용 약관과 라이선스 조건을 확인해야 한다."],"ans":2,"scene":null,"expl":"생성형 AI 산출물의 저작권 인정 여부는 <b>국가마다 다르며, 일부 국가에서는 인간의 창의적 개입 없이 AI가 생성한 콘텐츠를 저작권 보호 대상으로 인정하지 않는다</b>. 일관된 국제적 합의가 아직 없다.","partLabel":"업무활용·윤리"},{"q":"다음 중 AI 저작물의 라이선스 관리에 관한 설명으로 올바른 것을 모두 고르시오.","opts":["ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":0,"scene":["ㄱ. AI 생성 콘텐츠의 라이선스는 상업적 용도와 비상업적 용도를 명확히 구분해야 한다.","ㄴ. Creative Commons 라이선스는 AI 생성 콘텐츠에 적용할 수 없다.","ㄷ. AI 서비스 제공자의 이용 약관이 최종 산출물의 저작권 귀속에 영향을 미칠 수 있다.","ㄹ. 기업 내부에서 사용되는 AI 생성 콘텐츠는 라이선스 관리가 필요하지 않다."],"expl":"ㄱ과 ㄷ은 올바른 설명이다. AI 생성 콘텐츠의 라이선스는 용도를 명확히 구분해야 하며, AI 서비스 제공자의 이용 약관은 산출물의 저작권에 영향을 미친다. ㄴ은 인간의 창작적 기여가 인정된다면 Creative Commons 라이선스도 적용 가능하므로 틀린 설명이고, ㄹ도 내부 사용 콘텐츠도 재사용/배포/수정 권한 등을 명확히 하기 위해 라이선스 관리가 필요하다.","partLabel":"업무활용·윤리"},{"q":"다음 사례는 생성형 AI의 비즈니스 프로세스 적용에 관한 것이다. 이 사례에서 가장 중요하게 고려해야 할 윤리적 의사결정 요소를 고르시오.","opts":["데이터 프라이버시와 정보 보안","알고리즘 공정성과 편향성 방지","비용 효율성과 처리 속도","사용자 경험과 인터페이스 설계"],"ans":1,"scene":["한 금융회사는 대출 심사 과정에서 생성형 AI를 도입하여 고객 데이터 분석, 신용 평가, 위험 예측을 자동화했다. 이 시스템은 기존 대출 기록과 고객 데이터를 학습하여 대출 승인 여부에 대한 추천을 제공하며, 최종 결정에 중요한 영향을 미치고 있다."],"expl":"대출 심사와 같은 금융 의사결정에서는 <b>알고리즘의 공정성과 편향성 방지</b>가 가장 중요한 윤리적 고려사항이다. 특히 기존 데이터에 내재된 사회적 편향이 AI 의사결정에 반영되어 특정 집단에 대한 차별로 이어질 수 있기 때문이다.","partLabel":"업무활용·윤리"},{"q":"다음 중 생성형 AI의 비즈니스 도입 시 우선적으로 고려해야 할 사항을 고르시오.","opts":["기존 시스템의 완전한 대체","비용 대비 효과와 실현 가능성 분석","경쟁사의 도입 사례 모방","전체 인력의 감축 계획"],"ans":1,"scene":null,"expl":"생성형 AI를 비즈니스에 도입할 때는 <b>비용 대비 효과와 실현 가능성을 우선적으로 분석</b>해야 한다. 이는 기업의 자원을 효율적으로 활용하고 실제로 구현 가능한 솔루션을 선택하는 데 중요하다.","partLabel":"업무활용·윤리"},{"q":"다음 중 업무 프로세스에서 생성형 AI가 완전하게 수행하기 어려운 부분을 고르시오.","opts":["24시간 운영 가능성","창의적 문제 해결력","처리 속도","데이터 기반 분석"],"ans":1,"scene":null,"expl":"생성형 AI의 주요 한계점 중 하나는 <b>창의적 문제 해결력</b>이다. AI는 기존 데이터를 기반으로 작동하기 때문에, 완전히 새로운 아이디어를 생성하거나 복잡한 맥락을 이해하는 데 한계가 있다.","partLabel":"업무활용·윤리"},{"q":"다음 중 AI 학습데이터 관련 올바른 접근법을 고르시오.","opts":["무조건적 사용","적절한 라이선스 확인과 준수","출처 무시","임의 활용"],"ans":1,"scene":null,"expl":"AI 학습데이터를 사용할 때는 <b>적절한 라이선스를 확인하고 준수</b>해야 한다. 이는 저작권 침해를 방지하고 윤리적인 AI 개발을 보장하는 데 필수적이다.","partLabel":"업무활용·윤리"},{"q":"다음은 기업의 생성형 AI 도입 전략에 관한 설명이다. (가)~(다)에 들어갈 개념을 순서대로 고르시오.","opts":["(가) : 파일럿 프로젝트 - (나) : 확장 - (다) : 전사적 통합","(가) : 확장 - (나) : 전사적 통합 - (다) : 파일럿 프로젝트","(가) : 전사적 통합 - (나) : 파일럿 프로젝트 - (다) : 확장","(가) : 파일럿 프로젝트 - (나) : 전사적 통합 - (다) : 확장"],"ans":0,"scene":["기업의 AI 도입은 (가) 단계에서 특정 업무의 효율성 향상에 초점을 맞추고, (나) 단계에서 전사적 프로세스 재설계를 통한 가치사슬 혁신을 추구하며, 궁극적으로 (다) 단계에서 새로운 비즈니스 모델 창출과 시장 재정의를 목표로 한다."],"expl":"기업의 AI 도입은 일반적으로 <b>파일럿 프로젝트(Pilot Project) → 확장(Expansion) → 전사적 통합(Enterprise-wide Integration)</b>의 단계로 발전한다. 각 단계는 이전 단계보다 더 높은 가치와 복잡성을 가진다.","partLabel":"업무활용·윤리"},{"q":"다음 표는 산업별 생성형 AI 적용 사례와 해당 적용의 주요 윤리적 고려사항을 나타낸 것이다. 올바르지 않은 것을 고르시오.","opts":["의료","금융","인사관리","법률"],"ans":3,"scene":["표: 산업 | 적용 사례 | 주요 윤리적 고려사항","  의료 | 진단 보조 및 치료 계획 수립 | 환자 데이터 프라이버시, 의사결정 책임 소재","  금융 | 신용 평가 및 대출 심사 | 알고리즘 공정성, 투명성, 재정적 포용성","  인사관리 | 채용 지원자 초기 선별 | 다양성 보장, 편향성 방지, 감독 책임","  법률 | 판결 자동화 및 최종 선고 | 법적 해석의 정확성, 판사의 역할"],"expl":"법률 분야에서 AI는 판결 자동화 지원에 사용될 수 있으나, <b>\"최종 선고\"를 AI가 완전히 대체하는 것은 현재 윤리적, 법적으로 적절하지 않다</b>. 최종 판결은 인간 판사의 책임 하에 이루어져야 한다.","partLabel":"업무활용·윤리"}];
const MARK = ['①','②','③','④'];

const answered = {};
let submitted = false;
let timeIsUp = false;
let timeLeft = TIME_LIMIT;
let timerInterval = null;

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  // 본문 문항
  const root = document.getElementById('quiz');
  QUESTIONS.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'q';
    card.id = 'q-' + qi;
    let html = '<div class="q-top">' +
      '<span class="qno">문항 ' + (qi+1).toString().padStart(2,'0') + '</span>' +
      '<span class="tag">' + escHtml(item.partLabel) + '</span></div>' +
      '<div class="qtext">' + escHtml(item.q) + '</div>';
    if (item.scene && item.scene.length) {
      html += '<div class="scene">' +
        item.scene.map(s => '<span class="ln">• ' + escHtml(s) + '</span>').join('') +
        '</div>';
    }
    html += '<div class="opts" id="opts-' + qi + '">';
    item.opts.forEach((o, oi) => {
      html += '<button class="opt" data-oi="' + oi + '" onclick="pick(' + qi + ',' + oi + ')">' +
        '<span class="mk">' + MARK[oi] + '</span>' +
        '<span class="ot">' + escHtml(o) + '</span></button>';
    });
    html += '</div>';
    html += '<div id="rt-' + qi + '"></div>';
    html += '<div class="expl-box" id="ex-' + qi + '">' +
      '<div class="expl-head" id="exh-' + qi + '">📖 해설</div>' +
      '<div class="expl-body" id="exb-' + qi + '"></div></div>';
    card.innerHTML = html;
    root.appendChild(card);
  });

  // 답안 표기란 셀
  const grid = document.getElementById('ans-grid');
  for (let qi = 0; qi < TOTAL; qi++) {
    const cell = document.createElement('div');
    cell.className = 'ans-cell';
    cell.id = 'ac-' + qi;
    cell.onclick = () => scrollToQ(qi);
    cell.innerHTML = '<span class="num">' + (qi+1).toString().padStart(2,'0') + '</span>' +
      '<span class="mk">-</span>';
    grid.appendChild(cell);
  }
}

function scrollToQ(qi) {
  const el = document.getElementById('q-' + qi);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function pick(qi, oi) {
  if (submitted || timeIsUp) return;
  answered[qi] = oi;
  document.querySelectorAll('#opts-' + qi + ' .opt').forEach(b => {
    b.classList.toggle('sel', +b.dataset.oi === oi);
  });
  // 사이드바 셀 업데이트
  const cell = document.getElementById('ac-' + qi);
  cell.classList.add('has-ans');
  cell.querySelector('.mk').textContent = MARK[oi];
  updateProgress();
}

function updateProgress() {
  const name = document.getElementById('stu-name').value.trim();
  const done = Object.keys(answered).length;
  document.getElementById('p-done').textContent = done;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-todo').textContent = (TOTAL - done) + '개 남음';
  if (submitted) return;
  // 시간 종료 시 진행률 무관하게 제출 가능
  if (timeIsUp) {
    document.getElementById('sub-btn').disabled = !name;
  } else {
    document.getElementById('sub-btn').disabled = !(name && done === TOTAL);
  }
}

function calcScore() {
  let ok = 0;
  for (let i = 0; i < TOTAL; i++) {
    if (answered[i] !== undefined && answered[i] === QUESTIONS[i].ans) ok++;
  }
  const score = Math.round(ok / TOTAL * 100);
  let grade;
  if (score >= 90) grade = 'A';
  else if (score >= 80) grade = 'B';
  else if (score >= 70) grade = 'C';
  else if (score >= 60) grade = 'D';
  else grade = 'F';
  return { ok, score, grade };
}

function openPopup() {
  const name = document.getElementById('stu-name').value.trim();
  if (!name) {
    alert('이름을 입력해주세요.');
    document.getElementById('stu-name').focus();
    return;
  }
  const { ok, score, grade } = calcScore();
  document.getElementById('p-who').textContent = name + ' 학생';
  document.getElementById('p-score').innerHTML = score + '<small>점</small>';
  document.getElementById('p-ratio').textContent = ok + '/' + TOTAL + ' 정답';
  document.getElementById('p-grade').textContent = grade + ' 등급';
  document.getElementById('send-status').textContent = '';
  document.getElementById('send-status').className = 'status';
  document.getElementById('b-confirm').disabled = false;
  document.getElementById('b-confirm').textContent = '최종 제출';
  document.getElementById('b-cancel').style.display = timeIsUp ? 'none' : '';
  document.getElementById('pop').classList.toggle('timeup', timeIsUp);
  document.getElementById('pop-title').textContent = timeIsUp ? '시간 종료' : '제출 확인';
  document.getElementById('pop-bg').classList.add('show');
}

function closePopup() {
  if (timeIsUp) return; // 시간 종료 후엔 닫기 불가
  document.getElementById('pop-bg').classList.remove('show');
}

function collectAnswers() {
  const list = [];
  for (let i = 0; i < TOTAL; i++) {
    if (answered[i] !== undefined && answered[i] === QUESTIONS[i].ans) {
      list.push('O');
    } else {
      list.push('X');
    }
  }
  return list;
}

async function sendAndShow() {
  const name = document.getElementById('stu-name').value.trim();
  const { score } = calcScore();
  const status = document.getElementById('send-status');
  const btn = document.getElementById('b-confirm');

  btn.disabled = true;
  btn.textContent = '전송 중...';
  status.textContent = '서버로 전송 중입니다...';
  status.className = 'status';

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-cache',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        lesson: LESSON_ID,
        name,
        answers: collectAnswers(),
        score: score + '점'
      })
    });
    status.textContent = '✅ 전송 완료! 잠시 후 결과 화면이 표시됩니다.';
    status.className = 'status ok';
    setTimeout(showResults, 900);
  } catch (e) {
    status.textContent = '❌ 전송 실패: ' + e.message + ' (다시 시도해주세요)';
    status.className = 'status ng';
    btn.disabled = false;
    btn.textContent = '다시 전송';
  }
}

function showResults() {
  submitted = true;
  if (timerInterval) clearInterval(timerInterval);
  document.body.classList.remove('taking');
  document.body.classList.add('reviewing');
  document.getElementById('pop-bg').classList.remove('show');

  const name = document.getElementById('stu-name').value.trim();
  const { ok, score, grade } = calcScore();

  // 결과 배너
  const banner = document.getElementById('result-banner');
  document.getElementById('r-name').innerHTML = escHtml(name) + ' <small>학생 결과</small>';
  document.getElementById('r-score').textContent = score + '점';
  document.getElementById('r-ratio').textContent = ok + '/' + TOTAL + ' 정답';
  document.getElementById('r-grade').textContent = grade + ' 등급';
  banner.classList.add('show');

  // 각 문항 정오 표시
  QUESTIONS.forEach((item, qi) => {
    const opts = document.querySelectorAll('#opts-' + qi + ' .opt');
    const userPick = answered[qi];
    opts.forEach(b => {
      const oi = +b.dataset.oi;
      b.disabled = true;
      b.classList.remove('sel');
      if (oi === item.ans) b.classList.add('correct');
      else if (oi === userPick) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const isOk = userPick === item.ans;
    document.getElementById('rt-' + qi).innerHTML =
      '<span class="result-tag ' + (isOk ? 'ok' : 'ng') + '">' +
      (isOk ? '✓ 정답' : '✗ 오답 · 정답은 ' + MARK[item.ans]) + '</span>';

    // 해설 박스
    if (item.expl) {
      const ex = document.getElementById('ex-' + qi);
      if (!isOk) ex.classList.add('ng-bg');
      document.getElementById('exh-' + qi).innerHTML = isOk ? '📖 해설' : '📖 해설 · 정답은 ' + MARK[item.ans];
      document.getElementById('exb-' + qi).innerHTML = item.expl;
      ex.classList.add('show');
    }

    // 사이드바 셀: O/X 색상으로 변경
    const cell = document.getElementById('ac-' + qi);
    cell.classList.remove('has-ans');
    cell.classList.add('reviewed', isOk ? 'ok' : 'ng');
    const mkEl = cell.querySelector('.mk');
    if (userPick !== undefined) {
      mkEl.textContent = isOk ? '○' : '✗';
    } else {
      mkEl.textContent = '✗';  // 미응답도 오답
    }
  });

  document.getElementById('sub-bar').style.display = 'none';
  document.querySelector('.name-bar').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 타이머 ──
function updateTimerDisplay() {
  const t = document.getElementById('timer');
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  t.textContent = '⏱ ' + m + ':' + String(s).padStart(2,'0');
  t.classList.remove('warn-amber','warn-red');
  if (timeLeft <= 300) t.classList.add('warn-red');         // 5분 이하
  else if (timeLeft <= 600) t.classList.add('warn-amber');  // 10분 이하
}

function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (submitted) { clearInterval(timerInterval); return; }
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      onTimeUp();
    }
  }, 1000);
}

function onTimeUp() {
  if (submitted) return;
  timeIsUp = true;
  const t = document.getElementById('timer');
  t.textContent = '⏰ 시간 종료';
  t.classList.remove('warn-amber','warn-red');
  t.classList.add('timeup');
  // 응답 잠금
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  updateProgress();

  const name = document.getElementById('stu-name').value.trim();
  if (name) {
    setTimeout(openPopup, 400);  // 자동 제출 확인 팝업
  } else {
    alert('⏰ 시험 시간이 종료되었습니다.\n이름을 입력하고 [답안 제출] 버튼을 눌러주세요.');
    document.getElementById('stu-name').focus();
  }
}

// 새로고침/탭 닫기 방지
window.addEventListener('beforeunload', function(e) {
  if (!submitted && Object.keys(answered).length > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

render();
updateProgress();
startTimer();
</script>
</body>
</html>
