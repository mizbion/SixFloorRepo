<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- meta:subject=AIPOT -->
<!-- meta:unit=예상문제 -->
<!-- meta:title=1과목 예상문제 -->
<!-- meta:desc=보기 선택 시 정답·해설 자동 표시, GAN 도식·MCTS 순서 등 도식 반영 -->
<!-- meta:date=2026-05-26 -->

<title>AI-POT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ── Gold 팔레트 ── */
:root{
  --bg:#f9f6f0; --card:#ffffff;
  --surf2:#f3ede1; --surf3:#ece3d2;
  --border:#e3d8c3; --text:#1c1410; --sub:#6b5d49;
  --ac:#b45309; --ac-l:#fef6ec; --ac-b:#f3d9b5;
  --header-bg:#1a0f00; --grad-end:#d97706;
  --ok:#0d7a5f; --ok-bg:#e8f6f1; --ok-bd:#a8ddca;
  --ng:#b91c1c; --ng-bg:#fdeceb; --ng-bd:#f3b5b1;
  --shadow:0 1px 3px rgba(40,25,5,.07),0 6px 20px rgba(40,25,5,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
/* ── 진행바 ── */
.prog{position:fixed;top:0;left:0;height:4px;background:var(--grad-end);width:0;z-index:200;transition:width .25s ease}

/* ── 헤더 ── */
.hd{
  background:linear-gradient(120deg,var(--header-bg),#3a2400);
  color:#fff; padding:34px 20px 30px; position:relative; overflow:hidden;
}
.hd::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;
  background:radial-gradient(circle,var(--grad-end)55%,transparent 70%);opacity:.18;border-radius:50%}
.hd-inner{max-width:860px;margin:0 auto;position:relative;z-index:1}
.hd-badge{display:inline-block;font-family:'Black Han Sans';letter-spacing:1px;
  background:var(--grad-end);color:#1a0f00;padding:3px 14px;border-radius:20px;font-size:13px;margin-bottom:12px}
.hd-title{display:block;font-family:'Black Han Sans';font-size:30px;line-height:1.25;margin-bottom:8px}
.hd-meta{display:block;color:#f3d9b5;font-size:14px}

/* ── 본문 래퍼 ── */
.wrap{max-width:860px;margin:0 auto;padding:26px 18px 80px}

/* ── 대시보드 ── */
.dash{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin:4px 0 26px;
}
.dash .d{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.dash .d .n{font-family:'Black Han Sans';font-size:26px;line-height:1}
.dash .d .l{font-size:12px;color:var(--sub);margin-top:5px}
.dash .d.ok .n{color:var(--ok)} .dash .d.ng .n{color:var(--ng)}
.dash .d.sc .n{color:var(--ac)} .dash .d.dn .n{color:var(--text)}
@media(max-width:560px){.dash{grid-template-columns:repeat(2,1fr)}}

/* ── 섹션 헤더 ── */
.sh{display:flex;align-items:center;gap:10px;margin:34px 0 16px}
.sh .bar{width:5px;height:26px;background:var(--ac);border-radius:3px}
.sh h2{font-family:'Black Han Sans';font-size:22px}
.sh .tag{margin-left:auto;font-size:12px;color:var(--sub);background:var(--surf2);
  border:1px solid var(--border);padding:3px 11px;border-radius:20px}

/* ── 문항 카드 ── */
.q{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px 20px 8px;margin-bottom:18px;box-shadow:var(--shadow);position:relative}
.q .qno{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;background:var(--header-bg);color:var(--grad-end);
  font-family:'Black Han Sans';border-radius:9px;font-size:15px;margin-right:9px;vertical-align:-7px}
.q .qtext{font-weight:700;font-size:16px;display:inline}
.q .neg{color:var(--ng);text-decoration:underline;text-underline-offset:3px;font-weight:800}

/* 시나리오/지문 박스 */
.scene{background:var(--surf2);border:1px dashed var(--border);border-left:4px solid var(--ac);
  border-radius:10px;padding:13px 16px;margin:13px 0;font-size:14.5px;color:#3a2e1c}
.scene .sp{display:block;margin:3px 0}
.scene .who{font-weight:700;color:var(--ac)}
.scene ul{margin:0;padding-left:18px}
.scene li{margin:4px 0}

/* 보기 */
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--surf2);border:1.5px solid var(--border);border-radius:11px;
  padding:11px 14px;cursor:pointer;font-size:15px;color:var(--text);
  font-family:inherit;transition:all .15s ease}
.opt:hover{border-color:var(--ac-b);background:var(--ac-l)}
.opt .mk{flex:0 0 24px;height:24px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono';font-weight:600;font-size:13px;color:var(--sub);transition:all .15s}
.opt .ot{flex:1;line-height:1.5;padding-top:1px}
.opt .ot small{color:var(--sub);font-family:'JetBrains Mono';font-size:12.5px}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng-bd)}
.opt.wrong .mk{background:var(--ng);border-color:var(--ng);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}

/* GAN 표 보기 */
.tbl-opt{display:block;width:100%;text-align:left;background:var(--surf2);
  border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;cursor:pointer;
  font-family:inherit;color:var(--text);transition:all .15s;margin-bottom:9px}
.tbl-opt:hover{border-color:var(--ac-b);background:var(--ac-l)}
.tbl-opt.correct{background:var(--ok-bg);border-color:var(--ok-bd)}
.tbl-opt.wrong{background:var(--ng-bg);border-color:var(--ng-bd)}
.tbl-opt.dim{opacity:.55}
.tbl-opt table{width:100%;border-collapse:collapse;font-size:13px}
.tbl-opt td{padding:4px 6px;text-align:center}
.tbl-opt .rn{font-family:'JetBrains Mono';font-weight:700;color:var(--ac);width:26px}
.tbl-opt small{display:block;color:var(--sub);font-size:11px}

/* 해설 */
.exp{margin:6px 0 14px;border-radius:11px;overflow:hidden;border:1px solid var(--ok-bd);
  display:none}
.exp.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp .head{background:var(--ok);color:#fff;padding:8px 15px;font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:7px}
.exp.miss{border-color:var(--ng-bd)}
.exp.miss .head{background:var(--ng)}
.exp .body{background:var(--ok-bg);padding:14px 16px;font-size:14.5px;color:#22321f}
.exp.miss .body{background:var(--ng-bg);color:#3a1f1d}
.exp .body b{color:var(--ac)}
.exp .why{margin-top:10px;padding-top:10px;border-top:1px dashed var(--ok-bd)}
.exp.miss .why{border-top-color:var(--ng-bd)}
.exp .why .wt{font-weight:700;font-size:13px;color:var(--sub);margin-bottom:5px}
.exp .why ul{margin:0;padding-left:17px}
.exp .why li{margin:3px 0;font-size:13.5px}
.exp .why li b{color:var(--ng)}

/* 다시풀기 */
.retry{display:inline-flex;align-items:center;gap:5px;background:transparent;
  border:1px solid var(--border);color:var(--sub);font-size:12.5px;font-family:inherit;
  padding:5px 12px;border-radius:18px;cursor:pointer;margin:0 0 14px;transition:all .15s}
.retry:hover{border-color:var(--ac);color:var(--ac)}

/* GAN SVG 도식 */
.fig{background:var(--surf2);border:1px solid var(--border);border-radius:12px;
  padding:16px 10px;margin:14px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig .cap{font-size:12.5px;color:var(--sub);margin-top:8px}

/* 상단 안내 */
.intro{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:8px;font-size:14.5px;color:var(--sub);box-shadow:var(--shadow)}
.intro b{color:var(--ac)}

/* 푸터 */
.foot{text-align:center;color:var(--sub);font-size:13px;margin-top:40px}
.reset-all{margin-top:14px;background:var(--header-bg);color:var(--grad-end);border:none;
  font-family:'Noto Sans KR';font-weight:700;font-size:14px;padding:11px 26px;border-radius:24px;cursor:pointer}
.reset-all:hover{opacity:.9}
</style>
</head>
<body>

<div class="prog" id="prog"></div>

<header class="hd">
  <div class="hd-inner">
    <span class="hd-badge">PART 01</span>
    <span class="hd-title">1과목 : 인공지능 기초 이론</span>
    <!-- <span class="hd-meta">2급 15문항 + 1급 5문항 · 보기를 누르면 정답과 해설이 나타납니다</span> -->
  </div>
</header>

<div class="wrap">

  <div class="intro">
    각 문항의 <b>보기를 클릭</b>하면 정답 여부가 표시되고, 아래에 <b>문제 설명·정답 해설·오답 피하기</b>가 함께 펼쳐집니다.
    틀린 보기는 빨간색, 정답은 초록색으로 표시됩니다. 
  </div>

  <!-- 대시보드 -->
  <div class="dash">
    <div class="d sc"><div class="n" id="db-score">0</div><div class="l">점수 (5점×20)</div></div>
    <div class="d ok"><div class="n" id="db-ok">0</div><div class="l">맞은 문항</div></div>
    <div class="d ng"><div class="n" id="db-ng">0</div><div class="l">틀린 문항</div></div>
    <div class="d dn"><div class="n" id="db-done">0/20</div><div class="l">푼 문항</div></div>
  </div>

  <!-- ════════ 2급 ════════ -->
  <div class="sh"><div class="bar"></div><h2>2급 예상문제</h2><span class="tag">15문항</span></div>

  <div id="quiz-area"></div>

  <!-- ════════ 1급 ════════ -->
  <div class="sh" style="margin-top:46px"><div class="bar"></div><h2>1급 예상문제</h2><span class="tag">5문항</span></div>

  <div id="quiz-area-2"></div>

  <div class="foot">
    합격을 다지는 예상문제 · 인공지능 기초 이론<br>
    <button class="reset-all" onclick="resetAll()">↻ 전체 다시 풀기</button>
  </div>

</div>

<script>
/* ─────────── 문제 데이터 ───────────
   answer: 정답 보기 인덱스(0-base)
   opts: 보기 텍스트
   why: 오답 피하기(보기인덱스→이유). 없으면 생략
   scene: 지문/시나리오 HTML
   fig: 추가 도식 HTML(GAN SVG 등)
   expl: 정답 해설
*/
const Q2 = [
{n:1, q:'튜링 테스트에 대한 설명으로 가장 적절한 것을 고르시오.',
 opts:['컴퓨터의 연산 속도를 측정하는 테스트','기계가 인간처럼 생각할 수 있는지 판단하는 테스트','프로그램의 버그를 찾아내는 테스트','인공지능의 메모리 용량을 측정하는 테스트'],
 answer:1,
 expl:'튜링 테스트는 1950년 앨런 튜링이 제안한 것으로, 기계가 인간과 구별할 수 없는 대화를 할 수 있다면 그 기계는 <b>생각할 수 있다고 간주</b>하는 테스트입니다. 기계의 지능을 평가하는 방법으로, 인간과 구별할 수 없는 수준의 대화 능력을 보여주는지를 판단하는 것이 목적입니다.',
 why:{0:'연산 속도 측정은 튜링 테스트의 목적이 아니다.',2:'프로그램의 버그를 찾는 것은 튜링 테스트와 관련이 없다.',3:'메모리 용량 측정은 튜링 테스트의 목적이 아니다.'}},

{n:2, q:'다음 중 인공지능이라는 용어가 처음 등장한 시기와 장소를 고르시오.',
 opts:['1956년 다트머스 회의','1946년 ENIAC 개발 시기','1969년 ARPANET 개발 시기','1981년 IBM PC 출시 시기'],
 answer:0,
 expl:"'인공지능(Artificial Intelligence)'이라는 용어는 <b>1956년 다트머스 대학에서 열린 여름 연구 프로젝트</b>에서 처음 사용되었습니다. 이 회의는 존 매카시, 마빈 민스키, 나다니엘 로체스터, 클로드 섀넌 등이 주도했으며, 인공지능 연구 분야의 공식적인 시작점으로 여겨집니다.",
 why:{1:'ENIAC 개발은 중요한 컴퓨터 과학의 이정표이지만 AI 용어 첫 등장과 무관하다.',2:'ARPANET은 인터넷의 기원으로, AI 용어 첫 등장과 무관하다.',3:'IBM PC 출시는 개인용 컴퓨터 보급의 이정표일 뿐 AI 용어와 무관하다.'}},

{n:3, q:'다음 중 초기 인공지능의 주요 목표가 <span class="neg">아닌</span> 것을 고르시오.',
 opts:['논리적 추론 능력 구현','자연어 처리','블록체인 기술 개발','문제 해결 능력 구현'],
 answer:2,
 expl:'1950년대에 시작된 초기 인공지능의 주요 목표는 인간의 지능을 모방하는 것이었고, 이는 <b>논리적 추론, 자연어 처리, 문제 해결 능력</b> 등을 포함합니다. <b>블록체인 기술은 1990년대 후반(2008년 비트코인)에 등장한 개념</b>으로, 초기 인공지능 연구의 목표와 관련이 없습니다.'},

{n:4, q:'다음 중 인공지능 발전의 첫 번째 겨울이 발생한 주된 이유를 고르시오.',
 opts:['하드웨어 성능 부족','현실적 한계와 과대 홍보의 괴리','인터넷의 부재','프로그래밍 언어의 한계'],
 answer:1,
 expl:'인공지능의 첫 번째 겨울은 1970년대 중반부터 1980년대 초반까지 지속되었습니다. 이 시기에 AI 연구에 대한 관심과 자금이 급격히 감소했는데, 그 주된 이유는 <b>초기의 과대 홍보로 기대했던 것과 실제 기술의 한계 사이의 괴리</b>였습니다. 라이트힐 보고서와 같은 비판적 평가가 이에 영향을 미쳤습니다.',
 why:{0:'하드웨어 성능은 한 요인이었지만 주된 이유는 아니었다.',2:'인터넷의 부재는 AI 겨울의 직접적 원인이 아니다.',3:'프로그래밍 언어의 한계보다는 AI 기술 자체의 한계가 더 큰 문제였다.'}},

{n:5, q:'다음 중 딥러닝 혁명의 시작점으로 볼 수 있는 사건을 고르시오.',
 opts:['AlexNet의 ImageNet 우승','ENIAC의 개발','퍼셉트론의 발명','LISP 언어의 개발'],
 answer:0,
 expl:'2012년 <b>AlexNet의 ImageNet 대회 우승</b>은 딥러닝 혁명의 시작점입니다. 이때 기존 이미지 인식 오류율을 26%에서 15%로 크게 낮추며 딥러닝의 가능성을 입증하였고, 대부분의 컴퓨터 비전 연구가 딥러닝 기반으로 전환됩니다.',
 why:{1:'ENIAC은 최초의 범용 전자식 컴퓨터이나 딥러닝과는 관련이 없다.',2:'퍼셉트론은 인공신경망의 기초가 되었으나 딥러닝 혁명의 직접적 계기는 아니다.',3:'LISP는 인공지능 프로그래밍 언어이나 딥러닝 혁명과는 관련이 없다.'}},

{n:6, q:'다음 중 전문가 시스템(Expert System)의 특징이 <span class="neg">아닌</span> 것을 고르시오.',
 opts:['특정 분야의 전문 지식 활용','규칙 기반 추론','딥러닝 기술 사용','IF-THEN 규칙 적용'],
 answer:2,
 expl:'전문가 시스템은 전문가의 지식과 경험을 컴퓨터에 축적하여 문제를 해결하는 시스템입니다. <b>규칙 기반 추론과 IF-THEN 규칙</b>을 사용하며, 특정 분야의 전문 지식을 활용합니다. <b>딥러닝은 전문가 시스템과는 다른 접근 방식</b>입니다.'},

{n:7, q:'다음 중 지도학습의 예로 적절하지 <span class="neg">않은</span> 것을 고르시오.',
 opts:['이미지 분류','K-평균 군집화 <small>(K-mean Cluster Analysis)</small>','스팸 메일 분류','주택 가격 예측'],
 answer:1,
 expl:'<b>K-means 클러스터링은 대표적인 비지도학습 알고리즘</b>입니다. 데이터를 유사한 특성을 가진 그룹으로 나누는 작업을 수행하며, 레이블이 없는 데이터를 사용합니다. 나머지(이미지 분류, 스팸 분류, 주택 가격 예측)는 모두 정답 레이블이 있는 지도학습의 예입니다.'},

{n:8, q:'다음 중 강화학습의 주요 구성요소가 <span class="neg">아닌</span> 것을 고르시오.',
 opts:['상태','행동','레이블','보상'],
 answer:2,

const Q1 = [
{n:1, q:'다음 중 복잡한 문제를 해결하는 과정에서 "몬테카를로 트리 탐색(MCTS)" 알고리즘의 작동 단계를 올바른 순서로 나열한 것을 고르시오.',
 scene:'<ul><li><b>㉠ 시뮬레이션(Simulation)</b> – 선택된 노드에서 게임의 결과를 얻을 때까지 무작위로 플레이를 진행</li><li><b>㉡ 확장(Expansion)</b> – 선택된 노드에서 새로운 하위 노드 생성</li><li><b>㉢ 선택(Selection)</b> – 가장 유망한 노드 선별</li><li><b>㉣ 역전파(Backpropagation)</b> – 시뮬레이션 결과를 노드에 기록하여 다음 선택에 활용</li></ul>',

{n:2, q:'다음은 신경망에서 순전파(Forward Propagation)와 역전파(Back Propagation)에 관한 내용이다. 이에 대한 설명으로 옳지 <span class="neg">않은</span> 것을 고르시오.',

 opts:['순전파는 학습이 완료된 후에만 사용되고, 역전파는 학습 중에만 사용된다.','역전파는 체인 룰(Chain Rule)을 사용하여 각 가중치에 대한 손실 함수의 편미분을 계산한다.','대규모 신경망에서 역전파는 계산 복잡성이 높아 학습 속도가 느려질 수 있다.','심층 신경망에서 역전파는 기울기 소실(Vanishing Gradient) 문제를 일으킬 수 있다.'],

{n:3, q:'인공지능 모델의 성능 평가 지표에 관한 설명으로 가장 적절한 것을 고르시오.',
 opts:['F1 점수는 정밀도와 재현율의 산술평균으로, 항상 정밀도와 재현율 중 더 높은 값에 가깝게 계산된다.','ROC 곡선에서 AUC(Area Under Curve) 값이 0.5에 가까울수록 좋은 분류 모델이다.','정확도(Accuracy)는 데이터 불균형 문제가 있는 경우에도 가장 신뢰할 수 있는 평가 지표이다.','정밀도(Precision)는 모델이 양성으로 예측한 것 중 실제 양성의 비율로, 거짓 양성(False Positive)을 최소화하는 것이 중요한 경우에 주목해야 한다.'],
 answer:3,
 expl:'정밀도(Precision)는 모델이 양성으로 예측한 것 중 실제 양성의 비율(TP/(TP+FP))로, <b>거짓 양성(False Positive)을 최소화하는 것이 중요한 경우</b>에 주목해야 합니다. 예를 들어, 스팸 메일 분류에서 정상 메일을 스팸으로 잘못 분류하는 것을 최소화하려 할 때 중요한 지표입니다.',
 why:{0:'F1 점수는 정밀도와 재현율의 조화평균이며, 산술평균이 아니다. 또한 항상 두 값 사이에 위치하며 낮은 값에 가깝게 계산된다.',1:'ROC 곡선에서 AUC 값은 1에 가까울수록 좋은 분류 모델이다. 0.5는 랜덤 예측과 동일한 성능을 의미한다.',2:'정확도는 데이터 불균형 문제가 있는 경우 신뢰하기 어려운 지표이다. 예를 들어 전체 데이터의 99%가 한 클래스에 속하는 경우, 모든 데이터를 해당 클래스로 예측해도 99%의 정확도를 얻을 수 있다.'}},

{n:4, q:'몬테카를로 트리 탐색(MCTS) 알고리즘의 4단계 과정에 대한 설명으로 옳지 <span class="neg">않은</span> 것을 고르시오.',

/* ─────────── 렌더링 ─────────── */
const answered = {}; // key -> {grade:'ok'/'ng'}
let totalRendered = 0;

function render(list, prefix, mountId){
  const mount = document.getElementById(mountId);
  list.forEach(item=>{
    totalRendered++;
    const key = prefix + item.n;
    const card = document.createElement('div');
    card.className = 'q';
    let html = `<div><span class="qno">${item.n}</span><span class="qtext">${item.q}</span></div>`;
    if(item.scene) html += `<div class="scene">${item.scene}</div>`;
    if(item.fig) html += item.fig;

    // 보기
    if(item.tableOpts){
      html += `<div class="opts" id="opts-${key}">`;
      item.tableOpts.forEach((t,i)=>{
        html += `<button class="tbl-opt" data-i="${i}" onclick="pick('${key}',${i})">
          <table><tr>
            <td class="rn">${i+1}</td>
            <td>(a)<small>${t.labels[0]}</small></td>
            <td>(b)<small>${t.labels[1]}</small></td>
            <td>(c)<small>${t.labels[2]}</small></td>
            <td>(d)<small>${t.labels[3]}</small></td>
          </tr></table>
        </button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="opts" id="opts-${key}">`;
      item.opts.forEach((o,i)=>{
        const mark = String.fromCharCode(9312+i); // ①②③④
        html += `<button class="opt" data-i="${i}" onclick="pick('${key}',${i})">
          <span class="mk">${mark}</span><span class="ot">${o}</span></button>`;
      });
      html += `</div>`;
    }

    // 해설 영역
    let whyHtml = '';
    if(item.why){
      whyHtml = `<div class="why"><div class="wt">✕ 오답 피하기</div><ul>` +
        Object.keys(item.why).map(k=>`<li><b>${String.fromCharCode(9312+(+k))}</b> ${item.why[k]}</li>`).join('') +
        `</ul></div>`;
    }
    html += `<div class="exp" id="exp-${key}">
      <div class="head" id="exph-${key}">✓ 정답 해설</div>
      <div class="body"><b>정답: ${String.fromCharCode(9312+item.answer)}</b><br>${item.expl}${whyHtml}</div>
    </div>`;
    html += `<button class="retry" id="rt-${key}" style="display:none" onclick="retry('${key}')">↻ 다시 풀기</button>`;

    card.innerHTML = html;
    card._answer = item.answer;
    mount.appendChild(card);
  });
}

function pick(key, i){
  if(answered[key]) return; // 이미 푼 문항
  const opts = document.getElementById('opts-'+key);
  const buttons = opts.querySelectorAll('[data-i]');
  const card = opts.closest('.q');
  const ans = card._answer;
  const correct = (i===ans);

  buttons.forEach(b=>{
    const bi = +b.dataset.i;
    b.disabled = true;
    if(bi===ans) b.classList.add('correct');
    else if(bi===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const exp = document.getElementById('exp-'+key);
  const exph = document.getElementById('exph-'+key);
  if(correct){ exp.classList.remove('miss'); exph.textContent='✓ 정답입니다! · 정답 해설'; }
  else { exp.classList.add('miss'); exph.textContent='✗ 틀렸어요 · 정답 해설'; }
  exp.classList.add('show');
  document.getElementById('rt-'+key).style.display='inline-flex';

  answered[key] = {grade: correct?'ok':'ng'};
  updateDash();
}

function retry(key){
  const opts = document.getElementById('opts-'+key);
  opts.querySelectorAll('[data-i]').forEach(b=>{
    b.disabled=false; b.classList.remove('correct','wrong','dim');
  });
  document.getElementById('exp-'+key).classList.remove('show');
  document.getElementById('rt-'+key).style.display='none';
  delete answered[key];
  updateDash();
}

function updateDash(){
  let ok=0, ng=0;
  Object.values(answered).forEach(a=>{ a.grade==='ok'?ok++:ng++; });
  const done = ok+ng;
  document.getElementById('db-ok').textContent = ok;
  document.getElementById('db-ng').textContent = ng;
  document.getElementById('db-done').textContent = done+'/'+totalRendered;
  document.getElementById('db-score').textContent = ok*5;
  document.getElementById('prog').style.width = (done/totalRendered*100)+'%';
}

function resetAll(){
  Object.keys(answered).forEach(k=>retry(k));
  window.scrollTo({top:0,behavior:'smooth'});
}

render(Q2, 'a', 'quiz-area');
render(Q1, 'b', 'quiz-area-2');
updateDash();
</script>
